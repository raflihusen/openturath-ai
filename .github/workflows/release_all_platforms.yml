name: Release Multiplatform (APK, EXE, DMG)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════════════════════════
  # 1. BUILD ANDROID APK
  # ════════════════════════════════════════════════════════════════
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get

      - name: Build APK Release
        run: |
          cd openturath_ai
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTurath-AI-Android-APK
          path: openturath_ai/build/app/outputs/flutter-apk/app-release.apk

  # ════════════════════════════════════════════════════════════════
  # 2. BUILD WINDOWS EXE
  # ════════════════════════════════════════════════════════════════
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get

      - name: Build Windows Release
        run: |
          cd openturath_ai
          flutter build windows --release

      - name: Compress Windows Release Bundle
        run: |
          Compress-Archive -Path openturath_ai\build\windows\x64\runner\Release\* -DestinationPath openturath_ai\build\windows\OpenTurath_AI_Windows_x64.zip

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTurath-AI-Windows-x64
          path: openturath_ai/build/windows/OpenTurath_AI_Windows_x64.zip

  # ════════════════════════════════════════════════════════════════
  # 3. BUILD MACOS DMG
  # ════════════════════════════════════════════════════════════════
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get

      - name: Build macOS Release
        run: |
          cd openturath_ai
          flutter build macos --release

      - name: Package DMG Installer
        run: |
          cd openturath_ai/build/macos/Build/Products/Release
          mkdir -p dmg_folder
          cp -r openturath_ai.app dmg_folder/
          ln -s /Applications dmg_folder/Applications
          hdiutil create -volname "OpenTurath AI" -srcfolder dmg_folder -ov -format UDZO OpenTurath_AI_macOS.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTurath-AI-macOS-DMG
          path: openturath_ai/build/macos/Build/Products/Release/OpenTurath_AI_macOS.dmg
