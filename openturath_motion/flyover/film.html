<script type="module">
const W = 1440, H = 1152, CX = 720, CY = 576, F = 1880;
const gl = document.getElementById("gl").getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: true });
gl.getExtension("EXT_color_buffer_float");
const ANISO = gl.getExtension("EXT_texture_filter_anisotropic");
const sm = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mixf = (a, b, x) => a + (b - a) * x;
const eo3 = (x) => 1 - Math.pow(1 - cl(x), 3);

// ---------- data ----------
const meta = await (await fetch("assets/layers.json")).json();
const PH = meta.height, HERO_B = meta.hero.y + meta.hero.h;
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const makeTex = (img, mip = true) => {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  if (mip) gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (ANISO) gl.texParameterf(gl.TEXTURE_2D, ANISO.TEXTURE_MAX_ANISOTROPY_EXT, 16);
  return t;
};
const pageTex = makeTex(await loadImg("assets/page.png"));
const layers = [];
for (const l of meta.layers) { const img = await loadImg(`assets/layer_${l.id}.png`); layers.push({ ...l, tex: makeTex(img), iw: img.width, ih: img.height }); }
// ubin logo: tanda OpenTurath pada ubin putih bersudut bulat
const markImg = await loadImg("../public/promo/mark_black.svg");
const tileCanvas = document.createElement("canvas"); tileCanvas.width = tileCanvas.height = 512;
{ const c = tileCanvas.getContext("2d"); c.clearRect(0, 0, 512, 512);
  c.fillStyle = "#fff"; c.beginPath(); c.roundRect(16, 16, 480, 480, 120); c.fill();
  const mh = 250, mw = mh * 615 / 673; c.drawImage(markImg, 256 - mw / 2, 256 - mh / 2, mw, mh); }
const tileTex = makeTex(tileCanvas);
await document.fonts.load('500 74px GSF'); await document.fonts.load('italic 82px "Hoefler Text"'); await document.fonts.load('600 21px GSF');

// ---------- program helpers ----------
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + src); return s; };
const prog = (vs, fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
const VS3D = `#version 300 es
in vec3 a_pos; in vec2 a_uv;
uniform vec3 u_cam, u_fwd, u_up; uniform float u_f; uniform vec2 u_half;
out vec2 v_uv; out float v_zc; out vec3 v_w;
void main(){ vec3 v=a_pos-u_cam; float zc=dot(v,u_fwd); float xc=v.x; float yc=dot(v,u_up);
  gl_Position=vec4(xc*u_f/u_half.x, yc*u_f/u_half.y, zc-20.0, zc); v_uv=a_uv; v_zc=zc; v_w=a_pos; }`;
const sdRR = `float sdRR(vec2 p, vec4 r, float rad){ vec2 c=(r.xy+r.zw)*0.5; vec2 h=(r.zw-r.xy)*0.5-vec2(rad); vec2 q=abs(p-c)-h; return length(max(q,0.0))+min(max(q.x,q.y),0.0)-rad; }`;
const FLOORC = `vec3 floorColor(vec2 fc){ vec2 q=(fc-vec2(720.0,576.0))/vec2(980.0,820.0); float k=smoothstep(0.0,1.15,length(q)); return mix(vec3(0.9765,0.9843,0.9843), vec3(0.9490,0.9529,0.9647), k); }`;
const FS_FLOOR = `#version 300 es
precision highp float; in vec2 v_uv; in float v_zc; in vec3 v_w; layout(location=0) out vec4 o;
uniform vec4 u_rect; uniform float u_rad, u_shAmt; ${sdRR} ${FLOORC}
void main(){ vec3 c=floorColor(gl_FragCoord.xy*vec2(1.0,1.0)); vec2 p=vec2(v_w.x,-v_w.y);
  float d=sdRR(p-vec2(0.0,70.0),u_rect,u_rad); float s=(1.0-smoothstep(-40.0,170.0,d))*0.20*u_shAmt;
  float d2=sdRR(p-vec2(0.0,14.0),u_rect,u_rad); float s2=(1.0-smoothstep(-6.0,34.0,d2))*0.10*u_shAmt;
  c=mix(c,vec3(0.10,0.13,0.20),clamp(s+s2,0.0,1.0)); o=vec4(c,1.0); }`;
const FS_PAGE = `#version 300 es
precision highp float; in vec2 v_uv; in float v_zc; in vec3 v_w; layout(location=0) out vec4 o;
uniform sampler2D u_tex; uniform vec4 u_rect; uniform float u_rad, u_fade, u_heroB; ${sdRR} ${FLOORC}
void main(){ vec2 p=vec2(v_w.x,-v_w.y); float d=sdRR(p,u_rect,u_rad); float a=1.0-smoothstep(-0.5,0.5,d*0.0+d);
  vec3 c=texture(u_tex,v_uv).rgb; vec3 hz=vec3(0.9765,0.9843,0.9843); float f=u_fade*smoothstep(u_heroB-20.0,u_heroB+260.0,p.y); c=mix(c,hz,f);
  o=vec4(c*a,a); }`;
const FS_LAYER = `#version 300 es
precision highp float; in vec2 v_uv; in float v_zc; in vec3 v_w; layout(location=0) out vec4 o;
uniform sampler2D u_tex; uniform float u_op; uniform float u_haze;
void main(){ vec4 t=texture(u_tex,v_uv); vec3 hz=vec3(0.9765,0.9843,0.9843)*t.a; vec4 r=vec4(mix(t.rgb,hz,u_haze),t.a)*u_op; o=r; }`;
const FS_SHADOW = `#version 300 es
precision highp float; in vec2 v_uv; in float v_zc; in vec3 v_w; layout(location=0) out vec4 o;
uniform sampler2D u_tex; uniform float u_lod, u_op, u_rad;
float A(vec2 uv){ if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) return 0.0; return textureLod(u_tex,uv,u_lod).a; }
void main(){ float a=A(v_uv)*0.2; float w=0.8/12.0;
  for(int i=0;i<12;i++){ float t=float(i)*0.5235988; float r=u_rad*(i%2==0?1.0:0.5); a+=A(v_uv+vec2(cos(t),sin(t))*r)*w; }
  vec3 c=vec3(0.1020,0.1294,0.2); o=vec4(c*a,a)*u_op; }`;
const FS_DEPTH = `#version 300 es
precision highp float; in vec2 v_uv; in float v_zc; in vec3 v_w; layout(location=0) out vec4 o;
uniform sampler2D u_tex; uniform float u_use; uniform vec4 u_rect; uniform float u_rad; ${sdRR}
void main(){ float a=1.0; if(u_use>0.5) a=texture(u_tex,v_uv).a; else if(u_use<-0.5){ vec2 p=vec2(v_w.x,-v_w.y); a=1.0-smoothstep(-0.5,0.5,sdRR(p,u_rect,u_rad)); } if(a<0.5) discard; o=vec4(v_zc,0.0,0.0,1.0); }`;
const pFloor = prog(VS3D, FS_FLOOR), pPage = prog(VS3D, FS_PAGE), pLayer = prog(VS3D, FS_LAYER), pShadow = prog(VS3D, FS_SHADOW), pDepth = prog(VS3D, FS_DEPTH);

const VSQ = `#version 300 es
in vec2 a_p; out vec2 v_uv; void main(){ v_uv=a_p*0.5+0.5; gl_Position=vec4(a_p,0.0,1.0); }`;
const FS_DOF = `#version 300 es
precision highp float; in vec2 v_uv; out vec4 o;
uniform sampler2D u_col; uniform sampler2D u_dep; uniform float u_focus; uniform float u_near; uniform vec2 u_size;
float coc(float z){ if(z>=1.0e8) return 0.0; float r = z<u_focus ? u_near*(u_focus-z)/z : 6.0*(z-u_focus)/z; return min(120.0,r); }
void main(){ ivec2 ip=ivec2(gl_FragCoord.xy); float z=texelFetch(u_dep,ip,0).r; float R=coc(z);
  vec3 acc=texture(u_col,v_uv).rgb; float wsum=1.0;
  if(R>0.6){ float lod=max(0.0,log2(R*2.4/6.3));
    for(int i=0;i<40;i++){ float fi=float(i); float rr=R*sqrt((fi+0.5)/40.0); float th=fi*2.39996323; vec2 off=vec2(cos(th),sin(th))*rr; ivec2 q=clamp(ip+ivec2(off),ivec2(0),ivec2(u_size)-1);
      float zs=texelFetch(u_dep,q,0).r; float cs=coc(zs); float w=clamp(cs-rr+1.0,0.0,1.0); if(zs>z) w=max(w,clamp(R-rr+1.0,0.0,1.0)*0.0+w);
      vec2 uv=(vec2(q)+0.5)/u_size; acc+=textureLod(u_col,uv,lod).rgb*w; wsum+=w; } }
  else { }
  o=vec4(acc/wsum,1.0); }`;
const FS_ACC = `#version 300 es
precision highp float; in vec2 v_uv; out vec4 o; uniform sampler2D u_t; uniform float u_w; void main(){ o=vec4(texture(u_t,v_uv).rgb*u_w,1.0); }`;
const FS_OVL = `#version 300 es
precision highp float; in vec2 v_uv; out vec4 o; uniform sampler2D u_t; void main(){ o=texture(u_t,vec2(v_uv.x,1.0-v_uv.y)); }`;
const FS_OUT = `#version 300 es
precision highp float; in vec2 v_uv; out vec4 o; uniform sampler2D u_t; void main(){ vec3 c=texture(u_t,v_uv).rgb; o=vec4(clamp(c,0.0,1.0),1.0); }`;
const pDof = prog(VSQ, FS_DOF), pAcc = prog(VSQ, FS_ACC), pOvl = prog(VSQ, FS_OVL), pOut = prog(VSQ, FS_OUT);

const qbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qbuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const vbuf = gl.createBuffer();
const mkTarget = (internal, format, type, mip) => {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, W, H, 0, format, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, mip ? gl.LINEAR : gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f };
};
const scene = mkTarget(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, true);
const depth = mkTarget(gl.R32F, gl.RED, gl.FLOAT, false);
const dofT = mkTarget(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, false);
const accT = mkTarget(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, false);
const ovlTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, ovlTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
const ovl = document.createElement("canvas"); ovl.width = W; ovl.height = H; const oc = ovl.getContext("2d");

// ---------- kurva kecepatan dan kamera ----------
const speed = (t) => {
  if (t <= 0) return 0;
  if (t < 0.6) return 0.5 * sm(t / 0.6);
  if (t < 1.25) return 0.5;
  if (t < 1.6) return mixf(0.5, 1.0, sm((t - 1.25) / 0.35));
  if (t < 7.3) return 1.0 + 0.055 * Math.sin((2 * Math.PI * (t - 1.6)) / 2.4);
  if (t < 8.3) return mixf(speed(7.3 - 1e-6), 0.12, sm((t - 7.3) / 1.0));
  return 0.12 * (1 - sm((t - 8.3) / 0.6));
};
const TAB = []; { let a = 0; for (let i = 0; i <= 12000; i++) { TAB.push(a); a += speed(i * 0.001) * 0.001; } }
const integ = (t) => { const x = cl(t * 1000, 0, 11999); const i = Math.floor(x); return mixf(TAB[i], TAB[i + 1], x - i); };
const Y0 = 360, FOOT_Y = PH - 330;
const CRUISE = (FOOT_Y - Y0) / integ(8.0);
const Yview = (t) => Y0 + CRUISE * integ(t);
const D0 = 1360, D1 = 1700;
const dGlide = (t) => D0 + (D1 - D0) * eo3(t / 8.2);
const TILT = (56 * Math.PI) / 180;
const D_OVER = F * ((H - 84) / PH) ** -1; // jarak agar halaman utuh memenuhi bingkai dengan tepi 42px
const S_END = 1018 / 1440, D_END = F / S_END;
const poseOf = (Py, d, tilt) => {
  const fwd = [0, Math.sin(tilt), -Math.cos(tilt)], up = [0, Math.cos(tilt), Math.sin(tilt)];
  const P = [720, -Py, 0]; const C = [P[0] - d * fwd[0], P[1] - d * fwd[1], P[2] - d * fwd[2]];
  return { C, fwd, up, Py, d, tilt };
};
const screenY = (pose, X, Y, z = 0) => { const v = [X - pose.C[0], -Y - pose.C[1], z - pose.C[2]]; const zc = v[0] * pose.fwd[0] + v[1] * pose.fwd[1] + v[2] * pose.fwd[2]; const yc = v[1] * pose.up[1] + v[2] * pose.up[2]; return CY - (F * yc) / zc; };
const solveBottom = (d, tilt, target) => { let lo = -4000, hi = PH + 20000; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (screenY(poseOf(m, d, tilt), 720, PH) > target) lo = m; else hi = m; } return (lo + hi) / 2; };
const trap = (t) => { // kecepatan trapesium 7.75-9.25, luas 1
  const v = 1 / 1.05, a = 7.75, b = 8.35, c = 8.95, e = 9.25;
  if (t <= a) return 0; if (t >= e) return 1;
  if (t < b) { const x = t - a; return (v * x * x) / (2 * (b - a)); }
  if (t < c) return v * (b - a) / 2 + v * (t - b);
  const x = t - c, L = e - c; return v * (b - a) / 2 + v * (c - b) + v * (x - (x * x) / (2 * L));
};
const camera = (t) => {
  if (t < 7.75) return poseOf(Yview(t), dGlide(t), TILT);
  if (t < 9.25) {
    const d0 = dGlide(7.75), logd = Math.log(d0) + (Math.log(D_OVER) - Math.log(d0)) * trap(t), d = Math.exp(logd);
    const tilt = TILT * (1 - sm((t - 8.15) / 0.8));
    const glide = Yview(Math.min(t, 8.6));
    const solved = solveBottom(d, tilt, H - 42);
    const k = sm((t - 8.3) / 0.35);
    return poseOf(mixf(glide, solved, k), d, tilt);
  }
  if (t < 9.47) { const u = sm((t - 9.25) / 0.22); return poseOf(PH / 2, D_OVER * (1 - 0.035 * u), 0); }
  const dA = D_OVER * 0.965;
  let d, ytop;
  if (t < 9.97) { const u = (t - 9.47) / 0.5, q = u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u); d = Math.exp(mixf(Math.log(dA), Math.log(D_END), q)); ytop = 283 * sm((t - 9.7) / 0.27); }
  else { d = D_END / (1 + 0.02 * sm((t - 10.6) / 3.9)); ytop = 283; }
  const s = F / d; return poseOf((CY - ytop) / s, d, 0);
};

// ---------- geometri bidang ----------
const rotQuad = (cx, cy, hw, hh, z, ang) => { // pusat (X,Y) halaman, tinggi z, berdiri di sekitar sumbu-X lewat pusat
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const pt = (u, v) => [cx + u, -(cy) + v * ca, z + v * sa]; // v>0 = tepi atas halaman
  return [pt(-hw, hh), pt(hw, hh), pt(-hw, -hh), pt(hw, -hh)];
};
const drawQuad = (program, corners, uvs) => {
  const data = []; for (let i = 0; i < 4; i++) data.push(...corners[i], ...uvs[i]);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.DYNAMIC_DRAW);
  const ap = gl.getAttribLocation(program, "a_pos"), au = gl.getAttribLocation(program, "a_uv");
  gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(au); gl.vertexAttribPointer(au, 2, gl.FLOAT, false, 20, 12);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
};
const setCam = (program, pose) => {
  gl.useProgram(program);
  gl.uniform3fv(gl.getUniformLocation(program, "u_cam"), pose.C); gl.uniform3fv(gl.getUniformLocation(program, "u_fwd"), pose.fwd); gl.uniform3fv(gl.getUniformLocation(program, "u_up"), pose.up);
  gl.uniform1f(gl.getUniformLocation(program, "u_f"), F); gl.uniform2f(gl.getUniformLocation(program, "u_half"), W / 2, H / 2);
};
const U = (p, n) => gl.getUniformLocation(p, n);

// ---------- linimasa angkat ----------
const KIND = {
  tile: { rest: 6, peak: 70, stand: 24 }, button: { rest: 8, peak: 34, stand: 8 }, chip: { rest: 8, peak: 70, stand: 30 },
  card: { rest: 10, peak: 34, stand: 8 }, photo: { rest: 12, peak: 118, stand: 46 }, testimonial: { rest: 22, peak: 112, stand: 30 },
};
const FLY = (t) => 1 - sm((t - 7.9) / 1.15); // rata kembali saat naik
const liftOf = (l, t) => {
  const K = { ...KIND[l.kind] }; const yc = l.y + l.h / 2; let q;
  if (l.id.startsWith("hero")) { q = sm((t - 0.1) / 1.25); if (l.id.startsWith("hero-chip")) { K.peak = 70; } }
  else { const ahead = 900; q = sm((Yview(t) - (yc - ahead)) / (ahead - 80)); if (l.id.startsWith("answer-chip")) { K.peak = 200; K.stand = 54; } }
  const g = FLY(t);
  const z = (K.rest + (K.peak - K.rest) * q) * (0.4 + 0.6 * g) + 0 * g;
  return { z: l.kind === "tile" ? K.rest + (K.peak - K.rest) * q * g : z, stand: ((K.stand * Math.PI) / 180) * q * g };
};
// ubin logo
const TILES = [
  { // sebelum: di samping tombol hero, naik besar, menggantung di luar sudut halaman, mengekor, lalu keluar
    k: [[0, 790, 790, 6, 32], [0.1, 790, 790, 6, 32], [1.35, -170, 380, 170, 180], [2.4, -190, 560, 160, 190], [3.4, -170, 700, 240, 170], [5.4, -330, 2400, 380, 130], [7.0, -250, 3600, 210, 140]],
  },
  { k: [[0, 840, 790, 6, 32], [0.1, 840, 790, 6, 32], [1.35, 1610, 360, 180, 170], [2.4, 1630, 540, 150, 180], [3.4, 1620, 650, 260, 160], [5.0, 1700, 1500, 420, 150], [7.0, 1650, 2900, 240, 140]] },
  { k: [[0, 890, 790, 6, 32], [0.1, 890, 790, 6, 32], [1.35, 1530, 180, 140, 150], [2.4, 1560, 380, 120, 160], [3.4, 1580, 480, 280, 150], [6.0, 1760, 3500, 360, 140], [7.5, 1700, 4600, 240, 130]] },
  { k: [[0, 940, 790, 6, 32], [0.1, 940, 790, 6, 32], [1.35, -140, 170, 150, 140], [2.4, -170, 340, 130, 150], [3.4, -150, 420, 300, 150], [6.5, -300, 4100, 340, 140], [7.5, -260, 5000, 220, 130]] },
];
const tileState = (i, t) => {
  const k = TILES[i].k; let a = k[0], b = k[k.length - 1];
  if (t >= b[0]) a = b; else { for (let j = 0; j < k.length - 1; j++) if (t >= k[j][0] && t < k[j + 1][0]) { a = k[j]; b = k[j + 1]; break; } }
  const u = a === b ? 1 : sm((t - a[0]) / (b[0] - a[0]));
  let X = mixf(a[1], b[1], u), Y = mixf(a[2], b[2], u), z = mixf(a[3], b[3], u), s = mixf(a[4], b[4], u);
  // setelah penerbangan: ikut kamera menuju posisi akhir
  const e = sm((t - 8.2) / 1.3);
  const fin = [[300, 270, 220, 150], [1160, 286, 140, 120], [-380, 1100, 1900, 340], [1820, 1120, 2100, 380]][i];
  if (e > 0) { X = mixf(X, fin[0], e); Y = mixf(Y, fin[1], e); z = mixf(z, fin[2], e); s = mixf(s, fin[3], e); }
  const drift = Math.sin(t * 0.9 + i * 1.7) * 3 * sm((t - 10.6) / 1); X += drift; Y += Math.cos(t * 0.7 + i) * 2.5 * sm((t - 10.6) / 1);
  return { X, Y, z, s, tilt: 0.35 * (1 - e) + 0.12 };
};

// ---------- fokus analitik pada tengah bingkai ----------
const focusAt = (t, pose) => {
  const ro = pose.C; const dir = pose.fwd; // sinar tengah bingkai
  let best = 1e9;
  const test = (corners) => { // bidang dari tiga titik: (0)=kiri-atas,(1)=kanan-atas,(2)=kiri-bawah
    const p0 = corners[0], e1 = [0, 1, 2].map((i) => corners[1][i] - p0[i]), e2 = [0, 1, 2].map((i) => corners[2][i] - p0[i]);
    const n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    const dn = dir[0] * n[0] + dir[1] * n[1] + dir[2] * n[2]; if (Math.abs(dn) < 1e-9) return;
    const tt = ((p0[0] - ro[0]) * n[0] + (p0[1] - ro[1]) * n[1] + (p0[2] - ro[2]) * n[2]) / dn; if (tt <= 0) return;
    const hit = [ro[0] + dir[0] * tt - p0[0], ro[1] + dir[1] * tt - p0[1], ro[2] + dir[2] * tt - p0[2]];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const u = dot(hit, e1) / dot(e1, e1), v = dot(hit, e2) / dot(e2, e2);
    if (u >= 0 && u <= 1 && v >= 0 && v <= 1) best = Math.min(best, tt);
  };
  // halaman (hanya bila terlihat di sinar tengah)
  { const tt = -ro[2] / dir[2]; const hx = ro[0] + dir[0] * tt, hy = -(ro[1] + dir[1] * tt); if (tt > 0 && hx >= 0 && hx <= 1440 && hy >= 0 && hy <= PH) best = Math.min(best, tt); }
  for (const l of layers) { const { z, stand } = liftOf(l, t); test(rotQuad(l.x + l.w / 2, l.y + l.h / 2, l.w / 2, l.h / 2, z, stand)); }
  if (best > 1e8) { const tt = -ro[2] / dir[2]; best = tt > 0 ? tt : pose.d; }
  return best;
};

// ---------- gambar satu subframe ----------
const TITLE = { badge: 10.02, l1: 10.12, tail: 10.36 };
const L1 = ["Segera", "hadir,", "26", "Oktober."], L2 = ["Menjaga", "warisan,", "membuka", "cakrawala."];
const drawOverlay = (t) => {
  oc.setTransform(1, 0, 0, 1, 0, 0); oc.clearRect(0, 0, W, H); oc.filter = "none";
  if (t < TITLE.badge - 0.01) { gl.bindTexture(gl.TEXTURE_2D, ovlTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ovl); return false; }
  const bp = eo3((t - TITLE.badge) / 0.35);
  oc.save(); oc.globalAlpha = bp; oc.translate(0, (1 - bp) * 8);
  oc.font = '600 21px GSF'; const tw = oc.measureText("OpenTurath").width, bw = tw + 36 + 36 + 14, bh = 46;
  oc.shadowColor = "rgba(26,33,51,0.14)"; oc.shadowBlur = 22; oc.shadowOffsetY = 6; oc.fillStyle = "#fff"; oc.beginPath(); oc.roundRect(720 - bw / 2, 44 - bh / 2, bw, bh, 23); oc.fill();
  oc.shadowColor = "transparent"; const mh = 26, mw = mh * 615 / 673; oc.drawImage(markImg, 720 - bw / 2 + 18, 44 - mh / 2, mw, mh);
  oc.fillStyle = "#111"; oc.textBaseline = "middle"; oc.fillText("OpenTurath", 720 - bw / 2 + 18 + mw + 12, 45); oc.restore();
  const words = (arr, font, color, y, t0, gap, size) => {
    oc.font = font; const sp = oc.measureText(" ").width; const ws = arr.map((w) => oc.measureText(w).width); const total = ws.reduce((a, b) => a + b, 0) + sp * (arr.length - 1);
    let x = 720 - total / 2;
    arr.forEach((w, i) => {
      const p = eo3((t - (t0 + gap * i)) / 0.34);
      if (p > 0) { oc.save(); oc.globalAlpha = p; oc.filter = `blur(${((1 - p) * 12).toFixed(2)}px)`; oc.fillStyle = color; oc.textBaseline = "middle"; oc.fillText(w, x, y + (1 - p) * 16); oc.restore(); }
      x += ws[i] + sp;
    });
  };
  words(L1, '500 74px GSF', "#111111", 124, TITLE.l1, 0.06);
  words(L2, 'italic 400 82px "Hoefler Text"', "#8b8b92", 216, TITLE.tail, 0.05);
  gl.bindTexture(gl.TEXTURE_2D, ovlTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ovl); return true;
};

const rectOf = (t) => {
  if (t < 9.78) return [0, 0, 1440, PH];
  const k = sm((t - 9.78) / 0.19); return [0, 0, 1440, mixf(PH, HERO_B, k)];
};
const radOf = (t) => mixf(24, 38 / S_END, sm((t - 9.75) / 0.22));

const renderScene = (t, pose) => {
  gl.viewport(0, 0, W, H);
  const rect = rectOf(t), rad = radOf(t);
  const fade = sm((t - 9.5) / 0.3);
  const passes = [{ fb: scene.f, depthPass: false }, { fb: depth.f, depthPass: true }];
  for (const ps of passes) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, ps.fb); gl.disable(gl.DEPTH_TEST);
    if (ps.depthPass) { gl.disable(gl.BLEND); gl.clearColor(1e9, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
    else { gl.disable(gl.BLEND); gl.clearColor(0.97, 0.98, 0.98, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
    const BIG = 60000;
    const floor = [[-BIG, BIG, 0], [BIG, BIG, 0], [-BIG, -BIG, 0], [BIG, -BIG, 0]];
    const uvf = [[0, 0], [1, 0], [0, 1], [1, 1]];
    if (ps.depthPass) { setCam(pDepth, pose); gl.uniform1f(U(pDepth, "u_use"), 0); drawQuad(pDepth, floor.map((c) => [c[0], c[1], -1]), uvf); }
    else { setCam(pFloor, pose); gl.uniform4fv(U(pFloor, "u_rect"), rect); gl.uniform1f(U(pFloor, "u_rad"), rad); gl.uniform1f(U(pFloor, "u_shAmt"), 1); drawQuad(pFloor, floor.map((c) => [c[0], c[1], -1]), uvf); }
    // halaman
    const pg = [[0, 0, 0], [1440, 0, 0], [0, -PH, 0], [1440, -PH, 0]]; const upg = [[0, 0], [1, 0], [0, 1], [1, 1]];
    if (ps.depthPass) { setCam(pDepth, pose); gl.uniform1f(U(pDepth, "u_use"), -1); gl.uniform4fv(U(pDepth, "u_rect"), rect); gl.uniform1f(U(pDepth, "u_rad"), rad); drawQuad(pDepth, pg.map((c) => [c[0], c[1], c[2] + 0]), upg); }
    else {
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      setCam(pPage, pose); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pageTex); gl.uniform1i(U(pPage, "u_tex"), 0);
      gl.uniform4fv(U(pPage, "u_rect"), rect); gl.uniform1f(U(pPage, "u_rad"), rad); gl.uniform1f(U(pPage, "u_fade"), fade); gl.uniform1f(U(pPage, "u_heroB"), HERO_B);
      drawQuad(pPage, pg, upg);
    }
    // lapisan, terendah dulu
    const items = layers.map((l) => ({ l, ...liftOf(l, t) })).sort((a, b) => a.z - b.z);
    const heroCut = t > 9.25 ? 1 : 0;
    for (const it of items) {
      const { l, z, stand } = it; if (t > 9.3 && l.y > HERO_B - 10) continue;
      const cx = l.cx + l.cw / 2, cy = l.cy + l.ch / 2, hw = l.cw / 2, hh = l.ch / 2;
      const op = 1 - heroCut * 0;
      const corners = rotQuad(cx, cy, hw, hh, z, stand);
      if (ps.depthPass) { setCam(pDepth, pose); gl.bindTexture(gl.TEXTURE_2D, l.tex); gl.uniform1i(U(pDepth, "u_tex"), 0); gl.uniform1f(U(pDepth, "u_use"), 1); drawQuad(pDepth, corners, upg); continue; }
      // bayangan pada apa yang ada di bawah
      const blur = 7 + 0.5 * z, off = [0.10 * z, 4 + 0.36 * z], m = blur * 1.6;
      const sc = [cx + off[0], cy + off[1]]; const sq = [[sc[0] - hw - m, -(sc[1] - hh - m), 0.2], [sc[0] + hw + m, -(sc[1] - hh - m), 0.2], [sc[0] - hw - m, -(sc[1] + hh + m), 0.2], [sc[0] + hw + m, -(sc[1] + hh + m), 0.2]];
      const u0 = -m / (2 * hw), u1 = 1 + m / (2 * hw), v0 = -m / (2 * hh), v1 = 1 + m / (2 * hh);
      setCam(pShadow, pose); gl.bindTexture(gl.TEXTURE_2D, l.tex); gl.uniform1i(U(pShadow, "u_tex"), 0);
      const texPerPage = l.iw / (2 * hw); const lod = Math.min(5, Math.max(0, Math.log2(Math.max(1, blur * 0.45 * texPerPage))));
      gl.uniform1f(U(pShadow, "u_lod"), lod); gl.uniform1f(U(pShadow, "u_rad"), (blur * 0.5) / (2 * hw)); gl.uniform1f(U(pShadow, "u_op"), 0.26);
      drawQuad(pShadow, sq, [[u0, v0], [u1, v0], [u0, v1], [u1, v1]]);
      setCam(pLayer, pose); gl.bindTexture(gl.TEXTURE_2D, l.tex); gl.uniform1i(U(pLayer, "u_tex"), 0); gl.uniform1f(U(pLayer, "u_op"), op); gl.uniform1f(U(pLayer, "u_haze"), 0);
      // tepi putih tebal pada testimonial
      if (l.kind === "testimonial" && stand > 0.02) { const th = 34 * (stand / ((30 * Math.PI) / 180)); for (let s = 14; s >= 1; s--) { const c2 = rotQuad(cx, cy, hw, hh, z - (th * s) / 14, stand); setCam(pLayer, pose); gl.uniform1f(U(pLayer, "u_haze"), 0.9); drawQuad(pLayer, c2, upg); } gl.uniform1f(U(pLayer, "u_haze"), 0); }
      drawQuad(pLayer, corners, upg);
    }
    // ubin logo
    for (let i = 0; i < 4; i++) {
      const s = tileState(i, t); const hw = s.s / 2;
      const corners = rotQuad(s.X, s.Y, hw, hw, s.z, s.tilt); const upg2 = [[0, 0], [1, 0], [0, 1], [1, 1]];
      if (ps.depthPass) { setCam(pDepth, pose); gl.bindTexture(gl.TEXTURE_2D, tileTex); gl.uniform1i(U(pDepth, "u_tex"), 0); gl.uniform1f(U(pDepth, "u_use"), 1); drawQuad(pDepth, corners, upg2); continue; }
      const blur = 7 + 0.5 * s.z, m = blur * 1.6, sc = [s.X + 0.10 * s.z, s.Y + 4 + 0.36 * s.z];
      const sq = [[sc[0] - hw - m, -(sc[1] - hw - m), 0.2], [sc[0] + hw + m, -(sc[1] - hw - m), 0.2], [sc[0] - hw - m, -(sc[1] + hw + m), 0.2], [sc[0] + hw + m, -(sc[1] + hw + m), 0.2]];
      const u0 = -m / (2 * hw), u1 = 1 + m / (2 * hw);
      setCam(pShadow, pose); gl.bindTexture(gl.TEXTURE_2D, tileTex); gl.uniform1i(U(pShadow, "u_tex"), 0);
      gl.uniform1f(U(pShadow, "u_lod"), Math.min(5, Math.max(0, Math.log2(Math.max(1, blur * 0.45 * 512 / (2 * hw)))))); gl.uniform1f(U(pShadow, "u_rad"), (blur * 0.55) / (2 * hw)); gl.uniform1f(U(pShadow, "u_op"), 0.26);
      drawQuad(pShadow, sq, [[u0, u0], [u1, u0], [u0, u1], [u1, u1]]);
      setCam(pLayer, pose); gl.bindTexture(gl.TEXTURE_2D, tileTex); gl.uniform1i(U(pLayer, "u_tex"), 0); gl.uniform1f(U(pLayer, "u_op"), 1); gl.uniform1f(U(pLayer, "u_haze"), 0);
      drawQuad(pLayer, corners, upg2);
    }
  }
  gl.disable(gl.BLEND);
  gl.bindTexture(gl.TEXTURE_2D, scene.t); gl.generateMipmap(gl.TEXTURE_2D);
};

const quad = (program) => { const a = gl.getAttribLocation(program, "a_p"); gl.bindBuffer(gl.ARRAY_BUFFER, qbuf); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); };
const SUB = 16, SHUTTER = 0.7;
window.renderFrame = (tc, quality = 0.93) => {
  gl.bindFramebuffer(gl.FRAMEBUFFER, accT.f); gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  for (let k = 0; k < SUB; k++) {
    const t = tc + (SHUTTER / 60) * ((k + 0.5) / SUB - 0.5);
    const pose = camera(t);
    renderScene(t, pose);
    const focus = focusAt(t, pose);
    // DoF -> dofT
    gl.bindFramebuffer(gl.FRAMEBUFFER, dofT.f); gl.viewport(0, 0, W, H); gl.useProgram(pDof);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.t); gl.uniform1i(U(pDof, "u_col"), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depth.t); gl.uniform1i(U(pDof, "u_dep"), 1);
    gl.uniform1f(U(pDof, "u_focus"), focus); gl.uniform1f(U(pDof, "u_near"), mixf(75, 10, sm((t - 9.5) / 0.4))); gl.uniform2f(U(pDof, "u_size"), W, H); quad(pDof); gl.activeTexture(gl.TEXTURE0);
    // judul di atas hasil DoF
    const hasOv = drawOverlay(t);
    if (hasOv) { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.useProgram(pOvl); gl.bindTexture(gl.TEXTURE_2D, ovlTex); gl.uniform1i(U(pOvl, "u_t"), 0); quad(pOvl); gl.disable(gl.BLEND); }
    // akumulasi
    gl.bindFramebuffer(gl.FRAMEBUFFER, accT.f); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.useProgram(pAcc);
    gl.bindTexture(gl.TEXTURE_2D, dofT.t); gl.uniform1i(U(pAcc, "u_t"), 0); gl.uniform1f(U(pAcc, "u_w"), 1 / SUB); quad(pAcc); gl.disable(gl.BLEND);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(pOut);
  gl.bindTexture(gl.TEXTURE_2D, accT.t); gl.uniform1i(U(pOut, "u_t"), 0); quad(pOut);
  return document.getElementById("gl").toDataURL("image/jpeg", quality);
};
window.ready = true;
