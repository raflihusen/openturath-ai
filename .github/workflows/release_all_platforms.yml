name: Release Multiplatform (APK, EXE, DMG)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: openturath_ai
      - run: flutter analyze --no-pub
        working-directory: openturath_ai
      - run: flutter test --no-pub
        working-directory: openturath_ai
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: openturath_ai/functions
      - run: npm run check
        working-directory: openturath_ai/functions
      - run: npm test
        working-directory: openturath_ai/functions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
        working-directory: ecosystem/openturath_subscription
      - name: Test Android Google sign-in configuration guard
        run: python -m unittest discover -s openturath_ai/tool -p test_android_google_signin.py

  # ════════════════════════════════════════════════════════════════
  # 1. BUILD WINDOWS EXE (Installer & Portable Zip)
  # ════════════════════════════════════════════════════════════════
  build-windows-exe:
    needs: validate
    name: Build Windows EXE
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.4'
          cache: true

      - name: Setup NuGet for WebView2 native dependencies
        uses: NuGet/setup-nuget@v2

      - name: Install compatible CMake for Firebase C++ SDK
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.31.6'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get --enforce-lockfile

      - name: Build Windows Release
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          $ErrorActionPreference = 'Continue'
          cd openturath_ai
          $log = Join-Path $env:RUNNER_TEMP 'windows-build.log'
          flutter build windows --release 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host '=== WINDOWS BUILD ERROR SUMMARY ===' -ForegroundColor Red
            Select-String -Path $log -Pattern 'error |fatal error|CMake Error|LNK\d+|MSB\d+|Exception:' | ForEach-Object { $_.Line }
            exit $code
          }

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: ./openturath_ai/tool/package_windows.ps1

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: OpenTurath-AI-Windows-x64
          path: openturath_ai/build/windows/OpenTurath_AI_Windows_x64.zip

  # ════════════════════════════════════════════════════════════════
  # 2. BUILD MACOS DMG (Disk Image Installer)
  # ════════════════════════════════════════════════════════════════
  build-macos-dmg:
    needs: validate
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.4'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get --enforce-lockfile

      - name: Build macOS Release
        run: |
          cd openturath_ai
          flutter build macos --release
          git diff --exit-code -- macos/Runner/Release.entitlements

      - name: Package DMG Installer
        run: bash openturath_ai/tool/package_macos.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: OpenTurath-AI-macOS-DMG
          path: openturath_ai/build/macos/Build/Products/Release/OpenTurath_AI_macOS.dmg

  # ════════════════════════════════════════════════════════════════
  # 3. BUILD ANDROID APK
  # ════════════════════════════════════════════════════════════════
  build-apk:
    needs: validate
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Android Release Signing (from GitHub Secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PROPERTIES" ]; then
            echo "::error::Missing GitHub Actions secrets ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEY_PROPERTIES. Configure both in GitHub Settings -> Secrets and variables -> Actions. Release APK builds never fall back to debug signing."
            exit 1
          fi
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > openturath_ai/android/key.properties
          store_file="$(grep -E '^[[:space:]]*storeFile=' openturath_ai/android/key.properties | tail -n 1 | cut -d'=' -f2- | tr -d '\r' | xargs || true)"
          store_name="$(basename "${store_file:-openturath-release.jks}")"
          if [ -z "$store_name" ] || [ "$store_name" = "." ] || [ "$store_name" = ".." ]; then
            store_name="openturath-release.jks"
          fi
          keystore_path="openturath_ai/android/app/$store_name"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "Configured release keystore at $keystore_path"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.4'
          cache: true

      - name: Grant Executable Permission to Gradlew (if present)
        run: |
          if [ -f openturath_ai/android/gradlew ]; then
            chmod +x openturath_ai/android/gradlew
          fi

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get --enforce-lockfile

      - name: Build APK Release
        run: |
          cd openturath_ai
          flutter build apk --release

      - name: Verify APK package and Google OAuth signing certificate
        run: python3 openturath_ai/tool/check_android_google_signin.py --apk openturath_ai/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: OpenTurath-AI-Android-APK
          path: openturath_ai/build/app/outputs/flutter-apk/app-release.apk

  build-windows-setup:
    name: Build Windows Setup installer
    needs: build-windows-exe
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true
      - name: Install compatible CMake for Windows installer UI
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.31.6'
      - name: Download Windows application bundle
        uses: actions/download-artifact@v4
        with:
          name: OpenTurath-AI-Windows-x64
          path: openturath_ai/build/portable-artifact
      - name: Build single-file Windows Setup
        shell: pwsh
        env:
          OT_WIN_CERT_SHA1: ${{ secrets.OT_WIN_CERT_SHA1 }}
          OT_WIN_SIGN_COMMAND: ${{ secrets.OT_WIN_SIGN_COMMAND }}
          OT_WIN_TIMESTAMP_URL: ${{ secrets.OT_WIN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'openturath_ai/build/portable-artifact/OpenTurath_AI_Windows_x64.zip'
          $payload = 'openturath_ai/build/installer_payload'
          Expand-Archive -Path $archive -DestinationPath $payload
          ./openturath_ai/tool/build_windows_installer.ps1 -LocalOnly -PayloadDirectory (Resolve-Path $payload).Path
          $stage = 'openturath_ai/build/installer_stage'
          $setup = Join-Path $stage 'OpenTurath_AI_Windows_Setup.exe'
          Copy-Item (Join-Path $stage 'OpenTurath_AI_Windows_LocalTest_Setup.exe') $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  OpenTurath_AI_Windows_Setup.exe" | Set-Content "$setup.sha256" -Encoding ascii
      - name: Smoke test installer core and OTA wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'openturath_ai/build/installer_stage/ui/install_manifest.json'
          if (!(Test-Path $manifestPath)) { throw 'install_manifest.json missing from staged UI' }
          $manifestBytes = [IO.File]::ReadAllBytes($manifestPath)
          if ($manifestBytes.Length -ge 3 -and $manifestBytes[0] -eq 0xEF -and $manifestBytes[1] -eq 0xBB -and $manifestBytes[2] -eq 0xBF) {
            throw 'install_manifest.json must not contain a UTF-8 BOM'
          }
          $core = (Resolve-Path 'openturath_ai/build/installer_core/OpenTurath_AI_Core_Setup.exe').Path
          $target = Join-Path $env:RUNNER_TEMP 'openturath-installer-smoke'
          $proc = Start-Process -FilePath $core -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$target`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer core failed: $($proc.ExitCode)" }
          if (!(Test-Path (Join-Path $target 'openturath_ai.exe'))) { throw 'Installed executable missing' }
          if (!(Test-Path (Join-Path $target 'data/app.so'))) { throw 'Installed application data missing' }
          $setup = (Resolve-Path 'openturath_ai/build/installer_stage/OpenTurath_AI_Windows_Setup.exe').Path
          $otaTarget = Join-Path $env:RUNNER_TEMP 'openturath-ota-smoke'
          $otaProc = Start-Process -FilePath $setup -ArgumentList @('/OTAUPDATE', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/OTADIR=`"$otaTarget`"") -Wait -PassThru
          if ($otaProc.ExitCode -ne 0) { throw "OTA wrapper install failed: $($otaProc.ExitCode)" }
          if (!(Test-Path (Join-Path $otaTarget 'openturath_ai.exe'))) { throw 'OTA installed executable missing' }
      - name: Upload Windows Setup artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: OpenTurath-AI-Windows-Setup
          path: |
            openturath_ai/build/installer_stage/OpenTurath_AI_Windows_Setup.exe
            openturath_ai/build/installer_stage/OpenTurath_AI_Windows_Setup.exe.sha256
