name: Release Multiplatform (APK, EXE, DMG)

on:
  push:
    branches:
      - main
      - v9-2-integrasi
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: openturath_ai
      - run: flutter analyze --no-pub
        working-directory: openturath_ai
      - run: flutter test --no-pub
        working-directory: openturath_ai
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: openturath_ai/functions
      - run: npm run check
        working-directory: openturath_ai/functions
      - run: npm test
        working-directory: openturath_ai/functions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
        working-directory: ecosystem/openturath_subscription

  # ════════════════════════════════════════════════════════════════
  # 1. BUILD WINDOWS EXE (Installer & Portable Zip)
  # ════════════════════════════════════════════════════════════════
  build-windows-exe:
    needs: validate
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.4'
          cache: true

      - name: Setup NuGet for WebView2 native dependencies
        uses: NuGet/setup-nuget@v2

      - name: Install compatible CMake for Firebase C++ SDK
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.31.6'

      - name: Fix Firebase C++ SDK CMake policy for modern CMake
        shell: pwsh
        run: |
          [Environment]::SetEnvironmentVariable("CMAKE_POLICY_VERSION_MINIMUM", "3.5", "Machine")
          [Environment]::SetEnvironmentVariable("CMAKE_POLICY_VERSION_MINIMUM", "3.5", "Process")
          [Environment]::SetEnvironmentVariable("CMAKE_POLICY_VERSION_MINIMUM", "3.5", "User")
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get --enforce-lockfile

      - name: Build Windows Release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd openturath_ai
          flutter build windows --release --dart-define=CMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: ./openturath_ai/tool/package_windows.ps1

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: OpenTurath-AI-Windows-x64
          path: openturath_ai/build/windows/OpenTurath_AI_Windows_x64.zip

  # ════════════════════════════════════════════════════════════════
  # 2. BUILD MACOS DMG (Disk Image Installer)
  # ════════════════════════════════════════════════════════════════
  build-macos-dmg:
    needs: validate
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.4'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get --enforce-lockfile

      - name: Build macOS Release
        run: |
          cd openturath_ai
          flutter build macos --release
          git diff --exit-code -- macos/Runner/Release.entitlements

      - name: Package DMG Installer
        run: bash openturath_ai/tool/package_macos.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: OpenTurath-AI-macOS-DMG
          path: openturath_ai/build/macos/Build/Products/Release/OpenTurath_AI_macOS.dmg

  # ════════════════════════════════════════════════════════════════
  # 3. BUILD ANDROID APK
  # ════════════════════════════════════════════════════════════════
  build-apk:
    needs: validate
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.4'
          cache: true

      - name: Get dependencies
        run: |
          cd openturath_ai
          flutter pub get --enforce-lockfile

      - name: Build APK Release
        run: |
          cd openturath_ai
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: OpenTurath-AI-Android-APK
          path: openturath_ai/build/app/outputs/flutter-apk/app-release.apk
