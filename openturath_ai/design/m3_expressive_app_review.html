let lang='id',page='home',filter='all',query='',selected=0,plan=0,single=false,note=null;const $=id=>document.getElementById(id),t=()=>copy[lang];function b(label,action,kind='btn'){return `<button class="${kind}" data-action="${action}">${label}</button>`}function head(title,lead='',back=''){return `${back?`<button class="back" data-action="${back}">←</button>`:''}<div class="eyebrow">${t().overline}</div><h1 class="title">${title}</h1>${lead?`<p class="lead">${lead}</p>`:''}`}

if(page==='detail'){s=head(t().detail,'','catalog')+`<section class="card"><small>${t().bookSection}</small><h2 class="arabic" dir="rtl">${t().bookName}</h2><p class="arabic" dir="rtl">${t().bookAuthor}</p></section><h2 class="section">${t().detail}</h2><section class="card">${[['editor','سامي مكي العاني'],['publisher','مكتبة الفلاح - الكويت'],['volumes','1'],['pages','40']].map(([k,v])=>`<div class="metadata"><label>${t()[k]}</label><strong>${v}</strong></div>`).join('')}</section>${b(t().copy,'copy','btn secondary')} ${b(t().save,'saveBook')}`}
