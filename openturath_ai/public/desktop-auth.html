<!doctype html>
<html lang="id" data-auth="openturath-desktop-auth-v4">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Masuk — OpenTurath AI</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --text-main: #f4f4f5;
      --text-sub: #a1a1aa;
      --border: #27272a;
      --btn-bg: #ffffff;
      --btn-text: #18181b;
      --btn-hover: #e4e4e7;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8f8fa;
        --card-bg: #ffffff;
        --text-main: #18181b;
        --text-sub: #71717a;
        --border: #e4e4e7;
        --btn-bg: #18181b;
        --btn-text: #ffffff;
        --btn-hover: #27272a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    }
    .brand-mark {
      margin-bottom: 20px;
      display: inline-block;
    }
    h1 {
      font-family: "Newsreader", "Georgia", serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-sub);
      margin-bottom: 28px;
    }
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-google:hover:not(:disabled) {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }
    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-cancel {
      margin-top: 14px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 13px;
      cursor: pointer;
      padding: 8px 12px;
    }
    .btn-cancel:hover {
      text-decoration: underline;
    }
    .status-msg {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-sub);
      min-height: 1.5em;
    }
    .status-msg.error {
      color: #ef4444;
    }
    .status-msg.success {
      color: #22c55e;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand-mark">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4C14.059 4 6 12.059 6 22V44H42V22C42 12.059 33.941 4 24 4Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M24 12C18.477 12 14 16.477 14 22V44H34V22C34 16.477 29.523 12 24 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
      </svg>
    </div>
    <h1>OpenTurath AI</h1>
    <p class="desc">Masuk dengan akun Google Anda untuk mengakses perpustakaan kitab dan ruang telaah secara otomatis.</p>
    
    <button id="login" class="btn-google" disabled>
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      <span>Lanjutkan dengan Google</span>
    </button>
    <button id="cancel" class="btn-cancel" disabled>Batal</button>
    
    <p id="message" class="status-msg" role="status" aria-live="polite">Menyiapkan autentikasi…</p>
  </div>
  <script type="module" src="/desktop-auth.js"></script>
</body>
</html>
