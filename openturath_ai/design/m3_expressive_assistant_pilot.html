<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTurath · Asisten & Kartu Santri Digital</title>
  <style>
    @font-face{font-family:Outfit;src:url('../assets/native_fonts/NativeOutfit.ttf') format('truetype')}
    @font-face{font-family:Arabic;src:url('../assets/native_fonts/NativeArabic.ttf') format('truetype')}
    *{box-sizing:border-box}
    
    /* ── HITAM PUTIH (MONOCHROME LUXURY) PALETTE ── */
    :root{
      --canvas:#f6f6f4;
      --surface:#ffffff;
      --surface-low:#eeeeeb;
      --primary:#111113;
      --on-primary:#ffffff;
      --primary-container:#18181b;
      --on-primary-container:#f4f4f5;
      --ink:#111113;
      --muted:#666670;
      --outline:#d4d4d8;
      --line:#e4e4e7;
      --shadow:0 20px 48px rgba(0,0,0,.06);
      --card-bg:linear-gradient(135deg, #18181b 0%, #09090b 100%);
      --card-border:rgba(255,255,255,0.18);
      --card-text:#f4f4f5;
      --card-muted:#a1a1aa;
    }
    body.dark{
      --canvas:#09090b;
      --surface:#141416;
      --surface-low:#1d1d21;
      --primary:#ffffff;
      --on-primary:#09090b;
      --primary-container:#27272a;
      --on-primary-container:#fafafa;
      --ink:#fafafa;
      --muted:#9e9ea7;
      --outline:#3f3f46;
      --line:#27272a;
      --shadow:0 24px 56px rgba(0,0,0,.5);
      --card-bg:linear-gradient(135deg, #18181b 0%, #050507 100%);
      --card-border:rgba(255,255,255,0.22);
      --card-text:#ffffff;
      --card-muted:#a1a1aa;
    }
    
    html{background:#e7e7e5}
    body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font-family:Outfit,system-ui,sans-serif;transition:background .2s,color .2s}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:2.5px solid var(--primary);outline-offset:3px}
    
    .preview-controls{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;background:#dededc;color:#1c1c1f;box-shadow:0 1px 0 #cfcfcc}
    .preview-controls strong{font-size:11px;letter-spacing:.06em;margin-inline-end:8px;font-weight:750}
    .preview-controls button{border:1px solid #c2c2bf;border-radius:12px;background:#fff;color:#1c1c1f;min-height:38px;padding:0 14px;font-size:13px;font-weight:600}
    .preview-controls button[aria-pressed=true]{background:#111113;color:#fff;border-color:#111113}
    
    .phone{max-width:430px;min-height:890px;margin:24px auto;background:var(--canvas);border-radius:36px;box-shadow:var(--shadow);overflow:hidden;position:relative;border:1px solid var(--line)}
    .status{height:36px;padding:14px 26px 0;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:600}
    .app{padding:22px 20px 120px}
    
    .eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
    h1{font-size:34px;line-height:1.06;margin:10px 0 8px;letter-spacing:-.05em;font-weight:650}
    .lead{font-size:14.5px;line-height:1.48;color:var(--muted);margin:0 0 20px;max-width:34ch}
    
    /* ── SEARCH BAR ── */
    .search{display:flex;gap:12px;align-items:center;border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:0 16px;height:52px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.02)}
    .search svg{flex:none;color:var(--muted)}
    .search input{width:100%;border:0;outline:none;background:transparent;color:var(--ink);font-size:14.5px}
    .search input::placeholder{color:var(--muted);opacity:.85}
    
    .section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0 12px}
    .section-heading h2{font-size:18px;letter-spacing:-.03em;margin:0;font-weight:650}
    .section-heading small{color:var(--muted);font-size:12px}
    
    /* ── CHIPS MONOKROM ── */
    .filters{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .chip{min-height:38px;white-space:nowrap;padding:0 15px;border-radius:19px;background:var(--surface);border:1px solid var(--outline);color:var(--ink);font-size:12.5px;font-weight:600}
    .chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
    
    /* ── KARTU SANTRI DIGITAL (ATM BLACK CARD LUXURY) ── */
    .atm-card{
      position:relative;
      border-radius:24px;
      padding:22px 22px 20px;
      background:var(--card-bg);
      color:var(--card-text);
      border:1px solid var(--card-border);
      box-shadow:0 16px 36px rgba(0,0,0,0.18), inset 0 1px 1px rgba(255,255,255,0.2);
      overflow:hidden;
      margin:4px 0 24px;
      cursor:pointer;
      transition:transform .18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .18s;
    }
    .atm-card:hover{transform:translateY(-2px);box-shadow:0 20px 44px rgba(0,0,0,0.26)}
    .atm-card::after{
      content:'';
      position:absolute;
      top:-50%;
      left:-50%;
      width:200%;
      height:200%;
      background:radial-gradient(circle at 75% 25%, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events:none;
    }
    .atm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .atm-brand{display:flex;align-items:center;gap:8px}
    .atm-brand-text{font-size:17px;font-weight:700;letter-spacing:-.03em;font-family:Georgia,serif}
    .atm-nfc{opacity:.75}
    .atm-chip-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .emv-chip{
      width:40px;
      height:30px;
      border-radius:6px;
      background:linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa820a 100%);
      box-shadow:inset 0 1px 2px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3);
      position:relative;
      border:1px solid #8c6d13;
    }
    .emv-chip::before{
      content:'';
      position:absolute;
      inset:5px 8px;
      border:1px solid rgba(0,0,0,0.35);
      border-radius:2px;
    }
    .emv-chip::after{
      content:'';
      position:absolute;
      top:14px;
      left:0;
      right:0;
      height:1px;
      background:rgba(0,0,0,0.35);
    }
    .atm-pass-tag{
      font-size:10px;
      font-weight:750;
      letter-spacing:.14em;
      text-transform:uppercase;
      padding:4px 9px;
      border-radius:8px;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.15);
      color:#e4e4e7;
    }
    .atm-card-number{
      font-size:15px;
      letter-spacing:.26em;
      font-weight:550;
      font-family:'Courier New',Courier,monospace;
      color:rgba(244,244,245,0.92);
      margin-bottom:16px;
      text-shadow:0 1px 2px rgba(0,0,0,0.6);
    }
    .atm-bottom{display:flex;align-items:flex-end;justify-content:space-between;font-size:11px}
    .atm-holder-col{display:flex;flex-direction:column;gap:3px}
    .atm-holder-label{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--card-muted);font-weight:600}
    .atm-holder-name{font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
    .atm-expiry-col{display:flex;flex-direction:column;gap:3px;text-align:right}
    .atm-expiry-val{font-size:11.5px;font-weight:600;letter-spacing:.08em}
    .atm-action-btn{
      margin-top:16px;
      width:100%;
      min-height:40px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.22);
      background:rgba(255,255,255,0.12);
      color:#fff;
      font-size:12.5px;
      font-weight:650;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:background .15s;
    }
    .atm-action-btn:hover{background:rgba(255,255,255,0.2)}
    
    /* ── DOSSIER CARD (HITAM PUTIH ELEGAN) ── */
    .dossier{background:var(--surface);border-radius:24px;padding:22px;margin:0 0 24px;border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.03)}
    .dossier-top{display:flex;align-items:start;justify-content:space-between;gap:12px}
    .dossier .number{font-size:12px;color:var(--muted);font-weight:750;letter-spacing:.08em}
    .dossier .available{font-size:10.5px;color:var(--ink);background:var(--surface-low);border:1px solid var(--outline);padding:4px 8px;border-radius:8px;font-weight:650}
    .dossier h3{font-size:25px;line-height:1.1;margin:14px 0 2px;letter-spacing:-.04em;font-weight:650}
    .arabic{font-family:Arabic,serif;line-height:1.8;letter-spacing:0;direction:rtl;unicode-bidi:isolate}
    .dossier .arabic{font-size:20px;color:var(--muted);margin:0 0 10px}
    .dossier .scope{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0 0 16px}
    .sources{border-top:1px solid var(--line);padding-top:14px;margin-bottom:18px}
    .sources b{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
    .sources p{font-size:13.5px;line-height:1.45;margin:5px 0 0;color:var(--ink)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .actions button{min-height:44px;padding:0 16px;border-radius:14px;font-size:13px;font-weight:650}
    .primary{background:var(--primary);color:var(--on-primary);border:1px solid var(--primary)}
    .secondary{background:transparent;color:var(--ink);border:1px solid var(--outline)}
    
    /* ── DAFTAR ASISTEN: NOMOR + ROUNDED CORNERS + TANPA KATA-KATA DI BAWAHNYA ── */
    .list{
      background:var(--surface);
      border-radius:24px;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:0 2px 10px rgba(0,0,0,.02);
    }
    .agent-row{
      width:100%;
      display:flex;
      text-align:start;
      align-items:center;
      gap:14px;
      border:0;
      background:transparent;
      color:var(--ink);
      min-height:56px;
      padding:15px 18px;
      position:relative;
      transition:background .14s;
    }
    .agent-row+ .agent-row::before{
      content:'';
      position:absolute;
      inset-inline:18px;
      inset-block-start:0;
      border-top:1px solid var(--line);
    }
    .agent-row:hover{background:var(--surface-low)}
    .agent-row .index{
      font-size:13px;
      font-weight:750;
      color:var(--muted);
      width:24px;
      flex:none;
      font-variant-numeric:tabular-nums;
      letter-spacing:.02em;
    }
    .agent-row .title{
      font-size:15.5px;
      letter-spacing:-.02em;
      font-weight:600;
      flex:1;
      margin:0;
      color:var(--ink);
    }
    .agent-row .arrow{
      font-size:15px;
      color:var(--muted);
      opacity:.55;
      transition:transform .15s, opacity .15s;
      flex:none;
    }
    .agent-row:hover .arrow{opacity:1;transform:translateX(3px)}
    
    .empty{padding:26px;color:var(--muted);line-height:1.5;background:var(--surface);border-radius:20px;text-align:center}
    
    /* ── BOTTOM NAV (HITAM PUTIH MINIMALIS) ── */
    .bottom{position:absolute;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
    .nav-item{color:var(--muted);display:flex;align-items:center;flex-direction:column;gap:5px;font-size:11px;font-weight:600;min-height:46px;justify-content:center}
    .nav-item.current{color:var(--primary)}
    .nav-icon{height:24px;min-width:44px;display:grid;place-items:center;font-size:17px;line-height:1}
    .current .nav-icon{background:var(--surface-low);border-radius:14px}
    
    dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:24px;width:min(90vw,370px);box-shadow:var(--shadow)}
    dialog::backdrop{background:rgba(0,0,0,.6)}
    dialog h2{font-size:22px;margin:0 0 10px;letter-spacing:-.03em}
    dialog p{line-height:1.5;color:var(--muted);font-size:14px}
    dialog button{min-height:42px;border:0;border-radius:12px;background:var(--primary);color:var(--on-primary);padding:0 18px;font-weight:650;font-size:13px}
    
    [dir=rtl] .app,[dir=rtl] .agent-row{text-align:right}
    [dir=rtl] .lead{max-width:36ch}
    [dir=rtl] h1,[dir=rtl] .eyebrow,[dir=rtl] .dossier h3{letter-spacing:0}
    [dir=rtl] .agent-row:hover .arrow{transform:translateX(-3px)}
    @media(max-width:460px){html{background:var(--canvas)}.preview-controls{position:relative;flex-wrap:wrap}.phone{margin:0;box-shadow:none;border-radius:0;max-width:none;min-height:100vh}.app{padding-top:16px}}
  </style>
</head>
<body>
  <div class="preview-controls" aria-label="Kontrol pratinjau">
    <strong>OPEN TURATH · TEMA HITAM PUTIH</strong>
    <button type="button" data-lang="id" aria-pressed="true">Indonesia</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
    <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
    <button type="button" id="themeButton" aria-pressed="false">Gelap</button>
  </div>
  
  <div class="phone" id="phone">
    <div class="status" aria-hidden="true"><span>9:41</span><span>●●●  Wi-Fi  ▰</span></div>
    
    <main class="app">
      <div class="eyebrow" id="overline"></div>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      
      <!-- Search Input -->
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 5 5"/></svg>
        <input id="search" type="search" autocomplete="off">
      </label>
      
      <div class="section-heading"><h2 id="browseTitle"></h2><small id="browseHint"></small></div>
      <div class="filters" id="filters" role="group"></div>
      
      <!-- ── KARTU SANTRI DIGITAL / ATM BLACK CARD ── -->
      <section class="atm-card" id="atmCard" role="region" aria-label="Kartu Santri Digital">
        <div class="atm-top">
          <div class="atm-brand">
            <span class="atm-brand-text">OpenTurath</span>
          </div>
          <!-- Contactless NFC waves -->
          <svg class="atm-nfc" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M8.5 7a8 8 0 0 1 0 10"/>
            <path d="M12 4.5a12 12 0 0 1 0 15"/>
            <path d="M15.5 2a16 16 0 0 1 0 20"/>
          </svg>
        </div>
        
        <div class="atm-chip-row">
          <!-- Metallic EMV Chip -->
          <div class="emv-chip" aria-hidden="true"></div>
          <span class="atm-pass-tag" id="cardTier">SCHOLAR PASS · TIER I</span>
        </div>
        
        <div class="atm-card-number">•••• •••• •••• 1448</div>
        
        <div class="atm-bottom">
          <div class="atm-holder-col">
            <span class="atm-holder-label" id="cardHolderLabel">HOLDER</span>
            <span class="atm-holder-name" id="cardHolderName">M. FULAN (SANTRI)</span>
          </div>
          <div class="atm-expiry-col">
            <span class="atm-holder-label" id="cardExpiryLabel">VALID THRU</span>
            <span class="atm-expiry-val">12 / 28</span>
          </div>
        </div>
        
        <button type="button" class="atm-action-btn" id="atmAction">
          <span id="atmActionText">Buka Ruang Telaah Khusus</span>
          <span>&rarr;</span>
        </button>
      </section>
      
      <!-- Dossier Detail -->
      <div class="section-heading"><h2 id="selectedTitle"></h2><small id="selectedHint"></small></div>
      <section class="dossier" id="dossier" aria-live="polite"></section>
      
      <!-- ── DAFTAR ASISTEN: NOMOR + ROUNDED CORNERS + TANPA KATA-KATA DI BAWAHNYA ── -->
      <div class="section-heading"><h2 id="moreTitle"></h2></div>
      <div class="list" id="agentList"></div>
    </main>
    
    <div class="bottom" aria-label="Pratinjau navigasi aplikasi">
      <span class="nav-item"><span class="nav-icon">⌂</span><span id="navHome"></span></span>
      <span class="nav-item current"><span class="nav-icon">▣</span><span id="navAssistants"></span></span>
      <span class="nav-item"><span class="nav-icon">≡</span><span id="navNotes"></span></span>
      <span class="nav-item"><span class="nav-icon">⚙</span><span id="navSettings"></span></span>
    </div>
  </div>
  
  <dialog id="demoDialog">
    <h2 id="dialogTitle"></h2>
    <p id="dialogText"></p>
    <button type="button" id="dialogClose"></button>
  </dialog>

  <script>

    const agents = [
      {id:'fiqh_syafii', kind:'fiqh', name:{id:"Fikih Syafi'i", en:"Shafi'i Fiqh", ar:'الفقه الشافعي'}, arabic:'الفقه الشافعي', sources:['Al-Umm', 'Al-Majmu\' Syarah Al-Muhadzdzab']},
      {id:'fiqh_hanafi', kind:'fiqh', name:{id:'Fikih Hanafi', en:'Hanafi Fiqh', ar:'الفقه الحنفي'}, arabic:'الفقه الحنفي', sources:['Al-Mabsuth', 'Radd Al-Muhtar']},
      {id:'fiqh_maliki', kind:'fiqh', name:{id:'Fikih Maliki', en:'Maliki Fiqh', ar:'الفقه المالكي'}, arabic:'الفقه المالكي', sources:['Al-Mudawwanah', 'Bidayat al-Mujtahid']},
      {id:'fiqh_hanbali', kind:'fiqh', name:{id:'Fikih Hanbali', en:'Hanbali Fiqh', ar:'الفقه الحنبلي'}, arabic:'الفقه الحنبلي', sources:['Al-Mughni', 'Kasyf al-Qina\'']},
      {id:'hadits', kind:'hadith', name:{id:'Matan Hadits', en:'Hadith Texts', ar:'الحديث الشريف'}, arabic:'الحديث الشريف', sources:['Shahih Al-Bukhari', 'Shahih Muslim']},
      {id:'musthalah', kind:'hadith', name:{id:'Musthalah Hadits', en:'Hadith Terminology', ar:'مصطلح الحديث'}, arabic:'مصطلح الحديث', sources:['Muqaddimah Ibn Shalah', 'Nukhbat al-Fikar']},
      {id:'tafsir', kind:'tafsir', name:{id:"Tafsir Al-Qur'an", en:'Quranic Exegesis', ar:'تفسير القرآن'}, arabic:'تفسير القرآن', sources:["Tafsir Al-Qur'an Al-'Azhim", "Al-Jami' li Ahkam Al-Qur'an"]},
      {id:'ulum_quran', kind:'tafsir', name:{id:"Ulumul Qur'an", en:'Quranic Sciences', ar:'علوم القرآن'}, arabic:'علوم القرآن', sources:['Al-Itqan fi Ulum al-Qur\'an', 'Al-Burhan']}
    ];

    let lang = 'id', kind = 'all', selected = agents[0], query = '';
    const $ = id => document.getElementById(id);

    function render() {
      const t = copy[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      
      const bindings = {
        overline: 'overline', title: 'title', lead: 'lead',
        browse: 'browseTitle', hint: 'browseHint',
        selected: 'selectedTitle', selectedHint: 'selectedHint',
        more: 'moreTitle', navHome: 'navHome', navAssistants: 'navAssistants',
        navNotes: 'navNotes', navSettings: 'navSettings',
        cardTier: 'cardTier', cardHolder: 'cardHolderLabel',
        cardHolderName: 'cardHolderName', cardExpiry: 'cardExpiryLabel'
      };
      for (const [key, id] of Object.entries(bindings)) {
        if ($(id)) $(id).textContent = t[key];
      }
      
      $('atmActionText').textContent = t.cardAction;
      $('search').placeholder = t.search;
      $('search').setAttribute('aria-label', t.search);
      $('themeButton').textContent = document.body.classList.contains('dark') ? t.themeLight : t.themeDark;
      
      // Filter Chips
      $('filters').innerHTML = '';
      for (const k of ['all', 'fiqh', 'hadith', 'tafsir']) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = t[k];
        b.setAttribute('aria-pressed', String(kind === k));
        b.onclick = () => { kind = k; render(); };
        $('filters').append(b);
      }
      
      // Filter list
      const results = agents.filter(a =>
        (kind === 'all' || a.kind === kind) &&
        `${a.name[lang]} ${a.arabic} ${a.sources.join(' ')}`.toLocaleLowerCase().includes(query.toLocaleLowerCase())
      );
      if (results.length && !results.some(a => a.id === selected.id)) selected = results[0];
      
      // Dossier Section
      $('dossier').hidden = !results.length;
      if (results.length) {
        $('dossier').innerHTML = `
          <div class="dossier-top">
            <span class="number">${String(agents.indexOf(selected) + 1).padStart(2, '0')} / ${String(agents.length).padStart(2, '0')}</span>
            <span class="available">${t.available}</span>
          </div>
          <h3>${selected.name[lang]}</h3>
          <p class="arabic" lang="ar" dir="rtl">${selected.arabic}</p>
          <div class="sources">
            <b>${t.sources}</b>
            <p>${selected.sources.join(' · ')}</p>
          </div>
          <div class="actions">
            <button type="button" class="primary" id="openAgent">${t.open}</button>
            <button type="button" class="secondary" id="openLibrary">${t.library}</button>
          </div>
        `;
        $('openAgent').onclick = () => showDialog(t.dialogAction);
        $('openLibrary').onclick = () => showDialog(`${t.sources}: ${selected.sources.join(' · ')}`);
      }
      
      // ── DAFTAR ASISTEN: NOMOR + ROUNDED CORNERS + TANPA KATA-KATA DI BAWAHNYA ──
      const list = $('agentList');
      list.innerHTML = '';
      if (!results.length) {
        list.innerHTML = `<div class="empty">${t.empty}</div>`;
        return;
      }
      
      for (const [i, a] of results.entries()) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'agent-row';
        b.setAttribute('aria-label', a.name[lang]);
        
        // 1. Nomor urut dua digit (01, 02, 03, ...)
        const num = document.createElement('span');
        num.className = 'index';
        num.textContent = String(i + 1).padStart(2, '0');
        
        // 2. Hanya judul nama asisten (TANPA SUBTITLE/NAMA KITAB DI BAWAHNYA)
        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = a.name[lang];
        
        // 3. Panah indikator modern
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.innerHTML = lang === 'ar' ? '&larr;' : '&rarr;';
        
        b.append(num, title, arrow);
        b.onclick = () => {
          selected = a;
          render();
          $('dossier').scrollIntoView({ behavior: 'smooth', block: 'center' });
        };
        list.append(b);
      }
      
      $('dialogTitle').textContent = t.dialogTitle;
      $('dialogClose').textContent = t.close;
    }

    function showDialog(message) {
      $('dialogText').textContent = message;
      $('demoDialog').showModal();
    }
    
    $('dialogClose').onclick = () => $('demoDialog').close();
    $('atmCard').onclick = () => showDialog(copy[lang].dialogCard);
    $('search').addEventListener('input', e => { query = e.target.value; render(); });
    document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
      lang = b.dataset.lang;
      document.querySelectorAll('[data-lang]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      render();
    });
    $('themeButton').onclick = () => {
      document.body.classList.toggle('dark');
      $('themeButton').setAttribute('aria-pressed', String(document.body.classList.contains('dark')));
      render();
    };
    
    render();
  </script>
</body>
</html>
