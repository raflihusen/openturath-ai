<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap');

  function library(){return heading('Pustaka','Katalog Fikih Syafi’i',button('Tentang koleksi','collection',false,'info'))+`<section class="fg-catalog-banner"><div><span class="ot-label">Koleksi rujukan</span><h2>Fikih Syafi’i</h2><p>${catalog.length} edisi · Judul, pengarang, dan identitas kitab</p></div><div class="fg-catalog-art">${bookSculpture()}</div></section><div class="ot-tabs"><button type="button" aria-pressed="true" class="cursor-interaction">Kitab</button><button type="button" data-go="asisten" class="cursor-interaction">Asisten koleksi</button></div><div class="ot-toolbar"><label class="ot-search">${icon('search')}<input id="ot-book-search" aria-label="Cari kitab atau pengarang" placeholder="Cari kitab atau pengarang…" value="${esc(state.query)}"><span class="ot-shortcut">⌘ K</span></label><div class="ot-tools"><select id="ot-volume-filter" aria-label="Filter jilid"><option value="all">Semua jilid</option><option value="single">Satu jilid</option><option value="multi">Beberapa jilid</option></select>${button('Tersimpan','saved',false,'bookmark')}</div></div><div id="ot-library-results"></div>`;}
  function updateLibrary(){const target=screen.querySelector('#ot-library-results');if(!target)return;let items=filtered();if(state.onlySaved)items=items.filter(b=>state.savedBooks.includes(b.id));const pages=Math.max(1,Math.ceil(items.length/6));state.page=Math.min(state.page,pages-1);const page=items.slice(state.page*6,state.page*6+6);target.innerHTML=`<div class="ot-count" aria-live="polite"><span>${items.length} edisi kitab</span><span>Metadata katalog aplikasi</span></div>`+(items.length?`<div class="ot-table-head"><span>No.</span><span>Kitab & pengarang</span><span>Wafat</span><span>Jilid</span></div>`+page.map((b,i)=>`<button type="button" data-book="${b.id}" class="ot-book cursor-interaction" aria-label="Buka detail ${esc(title(b))}"><span class="ot-book-index">${String(state.page*6+i+1).padStart(2,'0')}</span><span><span class="ot-book-title" lang="ar">${esc(title(b))}</span><span class="ot-book-author" lang="ar">${esc(author(b))}</span></span><span class="ot-book-nums">${esc(b.tahun_wafat||'—')} H</span><span class="ot-book-nums">${esc(b['عدد_الأجزاء'])}</span></button>`).join('')+`<div class="ot-pagination"><span>${state.page*6+1}–${Math.min((state.page+1)*6,items.length)} dari ${items.length}</span><div class="ot-tools"><button type="button" data-action="previous" class="cursor-interaction" ${state.page===0?'disabled':''}>${icon('chevron-left')}<span>Sebelumnya</span></button><span>${state.page+1} / ${pages}</span><button type="button" data-action="next" class="cursor-interaction" ${state.page>=pages-1?'disabled':''}>Berikutnya${icon('chevron-right')}</button></div></div>`:`<div class="ot-empty">${icon('search')}<h2>${state.onlySaved?'Belum ada kitab tersimpan':'Kitab tidak ditemukan'}</h2><p>${state.onlySaved?'Buka detail kitab lalu pilih Simpan rujukan.':'Coba judul, pengarang, atau hapus filter pencarian.'}</p>${button('Tampilkan semua kitab','clear')}</div>`);icons();}
  function detail(){const b=book();return `<button type="button" data-go="pustaka" class="ot-back cursor-interaction">${icon('arrow-left')}Kembali ke pustaka</button><div class="ot-count"><span>Fikih Syafi’i</span><span>Identitas edisi</span></div><section class="fg-detail-head">${bookSculpture(title(b).length>18?'التراث':title(b),'OPENTURATH')}<div><h1 class="ot-detail-title ot-ar" lang="ar">${esc(b['الكتاب'])}</h1><p class="ot-detail-sub ot-ar" lang="ar">${esc(author(b))}</p></div></section><div class="ot-actions">${button(state.savedBooks.includes(b.id)?'Rujukan tersimpan':'Simpan rujukan','bookmark',true,'bookmark')}${button('Salin sitasi','citation',false,'copy')}${button('Buat catatan','book-note',false,'notebook-pen')}</div><dl class="ot-meta"><dt>Pengarang</dt><dd class="ot-ar" lang="ar">${esc(author(b))}</dd><dt>Tahqiq</dt><dd class="ot-ar" lang="ar">${esc(b['المحقق_أو_المعتني']||'لم يذكر')}</dd><dt>Penerbit</dt><dd class="ot-ar" lang="ar">${esc(b['الناشر'])}</dd><dt>Edisi & tahun</dt><dd class="ot-ar" lang="ar">${esc(b['سنة_الطبع_والطبعة'])}</dd><dt>Jumlah jilid</dt><dd>${esc(b['عدد_الأجزاء'])} jilid</dd><dt>Jumlah halaman</dt><dd>${esc(b['عدد_الصفحات'])} halaman</dd></dl><div class="ot-notice">${icon('info')}<span>Informasi mengikuti katalog aplikasi. Teks kitab dan nomor halaman kutipan dibuka melalui ruang kajian.</span></div>`;}
  const fields=[['Fikih','scale','6 asisten'],['Hadis','quote','1 asisten'],['Tafsir','book-open','1 asisten'],['Akidah','compass','1 asisten'],['Usul Fikih','git-branch','1 asisten'],['Bahasa Arab','languages','1 asisten']];
  function bookSculpture(label='الأم',subtitle='FIKIH SYAFI’I'){
    const volume=(front,back=false)=>`<div class="fg-volume ${back?'fg-volume-back':''}"><div class="fg-volume-base"></div><div class="fg-volume-spine"></div><div class="fg-volume-pages"></div><div class="fg-volume-top"></div><div class="fg-volume-cover"><span class="ot-ar" lang="ar">${esc(front)}</span><small>${esc(subtitle)}</small></div></div>`;
    return `<div class="fg-book-scene" aria-hidden="true">${volume('التراث',true)}${volume(label)}<div class="fg-glass-tag">${icon('library')}<span>Pustaka turats<small>Katalog & identitas edisi</small></span></div></div>`;
  }
  function kajian(){return heading('Ruang kajian Anda','Kitab, asisten, dan catatan dalam satu ruang.',button('Catatan baru','new-note',false,'notebook-pen'))+`<section class="fg-hub"><div class="fg-hub-copy"><span class="ot-label">Pustaka Fikih Syafi’i</span><h2>Mulai dari rujukannya.</h2><p>Telusuri kitab, periksa edisinya, lalu bawa pertanyaan Anda ke ruang kajian.</p><div class="ot-actions">${goButton('Buka pustaka','pustaka',true,'library')}${goButton('Pilih asisten','asisten',false,'arrow-right')}</div><div class="fg-hub-meta"><span>${catalog.length} edisi kitab</span><span>6 asisten Fikih</span></div></div>${bookSculpture()}</section><div class="fg-section-title"><h3>Bidang ilmu</h3><span class="ot-small ot-muted">Pilih cakupan kajian</span></div><div class="ot-field-grid">${fields.map(f=>`<button type="button" data-field="${f[0]}" class="ot-field cursor-interaction"><span><span class="fg-icon-tile">${icon(f[1])}</span>${f[0]}</span><small>${f[2]}</small>${icon('chevron-right')}</button>`).join('')}</div><div class="fg-workspace-grid"><section><div class="fg-section-title"><h3>Lanjutkan sesi</h3></div><div class="ot-resume"><div class="ot-flex"><span class="ot-label">Fikih Syafi’i</span><h2>Menelusuri bab thaharah</h2><p>Ibarah & rujukan kitab</p></div>${goButton('Lanjutkan','ruang',false,'arrow-up-right')}</div></section><section><div class="fg-section-title"><h3>Catatan terakhir</h3><button type="button" data-go="catatan" class="ot-text-button cursor-interaction">Semua ${icon('arrow-right')}</button></div><button type="button" data-note="0" class="ot-note-row fg-recent-note cursor-interaction"><span><span class="ot-label">Catatan pribadi</span><strong>${esc(notes[0].title)}</strong><small>${esc(notes[0].time)}</small></span>${icon('arrow-up-right')}</button></section></div><div class="ot-collection"><div><span class="ot-label">Koleksi khusus</span><h2 style="margin-top:7px">Fikih Tahawwulat</h2><p>Lima pendekatan untuk menelaah karya Al-Habib Abu Bakar Al-Adni Al-Masyhur.</p></div>${goButton('Jelajahi','tahawwulat',false,'arrow-right')}</div>`;}
  const assistants=[['Fikih Syafi’i','Matan, syarah, dan hasyiyah dalam mazhab Syafi’i.'],['Fikih Hanafi','Rujukan dan pembahasan dalam mazhab Hanafi.'],['Fikih Maliki','Rujukan dan pembahasan dalam mazhab Maliki.'],['Fikih Hanbali','Rujukan dan pembahasan dalam mazhab Hanbali.'],['Fikih Muqaran','Perbandingan pendapat dan rujukan fikih.'],['Fatwa & Masail','Penelusuran pembahasan masalah fikih.']];
  function assistantList(){const current=state.field==='Fikih'?assistants:[[state.field,'Telaah kitab dan rujukan dalam bidang '+state.field+'.']];return heading('Asisten '+state.field,'Pilih cakupan rujukan yang sesuai dengan kajian Anda.')+`<div class="ot-tabs"><button type="button" aria-pressed="true" class="cursor-interaction">Mazhab & fatwa</button><button type="button" data-go="tahawwulat" class="cursor-interaction">Fikih Tahawwulat</button></div>`+current.map((a,i)=>`<div class="ot-study-row"><span class="ot-study-icon">${icon('book-open')}</span><div><h3>${a[0]}</h3><p>${a[1]}</p>${i===0&&state.field==='Fikih'?'<button type="button" data-go="pustaka" class="ot-text-button cursor-interaction">Lihat kitab rujukan</button>':''}</div>${button('Mulai kajian',i===0&&state.field==='Fikih'?'start-room':'assistant-preview',i===0,'arrow-right')}</div>`).join('');}
  const roles=[['Al-Muhaqqiq','المحقق','Telaah matan, ibarah, dan rujukannya.'],['Al-Bayan','البيان','Pahami konsep dan istilah secara bertahap.'],['Al-Mukhtabir','المختبر','Uji pemahaman melalui tanya jawab.'],['Al-Habib','الحبيب','Telusuri materi muhadharah Habib Abu Bakar.'],['Al-Khatib','الخطيب','Susun bahan dakwah dan khutbah.']];
  function tahawwulat(){return heading('Fikih Tahawwulat','Karya Al-Habib Abu Bakar Al-Adni Al-Masyhur',button('Tentang koleksi','tahawwulat-info',false,'info'))+`<div class="ot-count"><span>Lima asisten khusus</span><button type="button" data-action="tahawwulat-info" class="ot-text-button cursor-interaction">Tentang pustaka ${icon('arrow-up-right')}</button></div>`+roles.map((r,i)=>`<div class="ot-role"><span class="ot-label">${String(i+1).padStart(2,'0')}</span><div><h3>${r[0]} <span class="ot-ar" lang="ar">${r[1]}</span></h3><p>${r[2]}</p></div>${button('Mulai kajian','role-'+i,i===0,'arrow-right')}</div>`).join('');}
  function room(){return `<div class="ot-room" data-sources="${state.sources}"><div class="ot-conversation"><div class="ot-session"><span><strong>${esc(state.role||'Fikih Syafi’i')}</strong> <span class="ot-muted">/ Menelusuri rujukan</span></span>${button('Rujukan','sources',false,'panel-right')}</div><div class="ot-question">Bagaimana mulai menelaah kitab dan mencatat rujukannya?</div><article class="ot-answer"><span class="ot-label">Asisten kajian</span><h3>Mulai dari kitab dan edisi yang dipakai</h3><p>Tentukan rujukan awal, lalu buka daftar isi untuk menemukan judul bab. Catat identitas edisi agar halaman yang Anda simpan dapat ditemukan kembali.</p><p>Pisahkan kutipan asli dari ringkasan dan catatan pribadi. Saat pembahasan ditemukan, simpan bersama judul kitab, jilid, dan halaman.</p><div class="ot-answer-actions">${button('Salin','copy-answer',false,'copy')}${button('Simpan ke catatan','save-answer',false,'bookmark')}</div></article><form class="ot-composer" id="ot-chat-form"><textarea id="ot-message" aria-label="Pertanyaan kajian" placeholder="Tulis pertanyaan kajian…"></textarea><div class="ot-composer-bottom"><span>Periksa hasil pada sumbernya.</span><button type="submit" class="ot-primary cursor-interaction" aria-label="Kirim pertanyaan contoh">${icon('arrow-up')}</button></div></form></div><aside class="ot-references"><h3>Kitab rujukan</h3><span class="ot-small ot-muted">Identitas sumber</span>${(state.role?.startsWith('Fikih Tahawwulat')?[]:catalog.slice(0,3)).map(b=>`<button type="button" data-book="${b.id}" class="ot-source cursor-interaction">${icon('book-open')}<span><span class="ot-ar" lang="ar">${esc(title(b))}</span><small>${esc(b['عدد_الأجزاء'])} jilid · ${esc(b['الناشر'])}</small></span></button>`).join('')}${state.role?.startsWith('Fikih Tahawwulat')?'<p class="ot-small ot-muted">Rujukan akan muncul bersama jawaban. Sumber Tahawwulat belum dimuat dalam ilustrasi ini.</p>':`<div class="ot-section-label"><h3>Catatan kajian</h3></div><button type="button" data-note="0" class="ot-source cursor-interaction">${icon('notebook-pen')}<span>Peta bacaan<small>Catatan pribadi</small></span></button>`}</aside></div>`;}
  function noteList(){const list=notes.map((n,i)=>({n,i})).filter(({n})=>state.noteFilter==='Semua'||n.kind===state.noteFilter);return heading('Catatan','Tulisan pribadi, jawaban tersimpan, dan rujukan kitab.',button('Catatan baru','new-note',true,'plus'))+`<div class="ot-tabs">${['Semua','Catatan pribadi','Jawaban AI','Rujukan kitab'].map(k=>`<button type="button" data-note-filter="${k}" aria-pressed="${state.noteFilter===k}" class="cursor-interaction">${k}</button>`).join('')}</div><div class="ot-notes">`+list.map(({n,i})=>`<button type="button" data-note="${i}" class="ot-note-row cursor-interaction"><span><strong>${esc(n.title||'Catatan tanpa judul')}</strong><p>${esc(n.preview)}</p><small>${esc(n.kind)} · ${esc(n.time)}</small></span>${icon('chevron-right')}</button>`).join('')+`</div>`;}
  function editor(){const n=notes[activeNote];return `<div class="ot-editor-head"><button type="button" data-go="catatan" class="ot-back cursor-interaction" style="margin:0">${icon('arrow-left')}Catatan</button><div class="ot-tools"><span class="ot-small ot-muted" id="ot-draft-state" role="status">Draf contoh</span>${button('Simpan','save-note',true,'check')}</div></div><div class="ot-editor-tools">${[['bold','Tebal'],['italic','Miring'],['list','Daftar'],['quote','Kutipan'],['heading','Judul'],['align-right','Arah Arab']].map(t=>`<button type="button" data-format="${t[0]}" aria-label="${t[1]}" class="cursor-interaction">${icon(t[0])}</button>`).join('')}</div><input class="ot-editor-title" id="ot-note-title" aria-label="Judul catatan" placeholder="Judul catatan" value="${esc(n.title)}"><textarea class="ot-editor-body" id="ot-note-body" aria-label="Isi catatan" placeholder="Mulai menulis…" dir="auto">${esc(n.body)}</textarea><div class="ot-inline-reference">${icon('book-open')}<span>Rujukan: <span class="ot-ar" lang="ar">${esc(title(catalog.find(b=>b.id===n.book)||catalog[0]))}</span></span><button type="button" data-action="note-book" class="ot-text-button cursor-interaction">Lihat edisi ${icon('arrow-up-right')}</button></div>`;}
  function account(){return heading('Akun','Kelola akses dan preferensi ruang kajian Anda.')+`<div class="ot-account"><div class="ot-person"><span class="ot-avatar">P</span><div><h3>Pengguna contoh</h3><p class="ot-small ot-muted">Akun pratinjau</p></div></div><div class="ot-section-label"><h3>Akses kajian</h3></div><div class="ot-setting"><div><strong>Fikih Syafi’i</strong><p>Status akses mengikuti akun aplikasi.</p></div>${goButton('Lihat pilihan','akses',false,'arrow-right')}</div><div class="ot-section-label"><h3>Preferensi</h3></div><div class="ot-setting"><div>Tampilan<p>Gunakan mode yang nyaman untuk membaca.</p></div><select id="ot-account-theme" aria-label="Tampilan"><option value="system">Ikuti sistem</option><option value="light">Terang</option><option value="dark">Gelap</option></select></div><div class="ot-setting"><div>Bahasa<p>Bahasa antarmuka aplikasi.</p></div><span>Indonesia</span></div><div class="ot-setting"><span>Ukuran teks bacaan</span>${button('Atur ukuran','text-size',false,'type')}</div><div class="ot-section-label"><h3>Bantuan</h3></div><div class="ot-setting"><span>Tentang OpenTurath</span>${button('Buka','about',false,'arrow-up-right')}</div><div class="ot-setting"><span>Ketentuan & privasi</span>${button('Baca','legal',false,'arrow-up-right')}</div><div class="ot-actions">${goButton('Keluar akun','login',false,'log-out')}</div></div>`;}
  const offerPeriods=['1 bulan','6 bulan','1 tahun'];
  const offerAmounts={specialist:[50000,299000,499000],tahawwulat:[300000,1499000,1999000]};
  const rupiah=n=>'Rp '+n.toLocaleString('id-ID');
  function access(){return heading('Pilihan akses','Pilih cakupan kajian yang Anda perlukan.')+`<div class="ot-tools"><label for="ot-offer-period" class="ot-small ot-muted">Periode akses</label><select id="ot-offer-period" aria-label="Periode akses">${offerPeriods.map((v,i)=>`<option value="${i}" ${i===state.offerIndex?'selected':''}>${v}</option>`).join('')}</select></div><div class="ot-plans"><section class="ot-plan"><span class="ot-label">Modul pilihan</span><div><h2>Fikih Syafi’i</h2><p class="ot-small ot-muted" style="margin-top:7px">Telaah rujukan dalam mazhab Syafi’i.</p></div><ul><li>${icon('check')}Asisten kajian Fikih Syafi’i</li><li>${icon('check')}Katalog kitab rujukan</li><li>${icon('check')}Simpan hasil dan catatan</li></ul><div class="ot-setting" style="padding:10px 0"><span>Periode akses</span><span>${offerPeriods[state.offerIndex]}</span></div><p class="ot-price">${rupiah(offerAmounts.specialist[state.offerIndex])}<small> / ${offerPeriods[state.offerIndex]}</small></p>${button('Lihat ringkasan','order',true,'arrow-right')}</section><section class="ot-plan"><span class="ot-label">Koleksi khusus</span><div><h2>Fikih Tahawwulat</h2><p class="ot-small ot-muted" style="margin-top:7px">Lima pendekatan untuk satu khazanah.</p></div><ul><li>${icon('check')}Lima asisten khusus</li><li>${icon('check')}Pustaka Fikih Tahawwulat</li><li>${icon('check')}Simpan hasil dan catatan</li></ul><div class="ot-setting" style="padding:10px 0"><span>Periode akses</span><span>${offerPeriods[state.offerIndex]}</span></div><p class="ot-price">${rupiah(offerAmounts.tahawwulat[state.offerIndex])}<small> / ${offerPeriods[state.offerIndex]}</small></p>${button('Lihat ringkasan','order-tahawwulat',false,'arrow-right')}</section></div><div class="ot-actions">${button('Gunakan kode akses','redeem',false,'ticket')}</div><div class="ot-notice">${icon('info')}<span>Rancangan pilihan akses. Tidak terhubung ke pembayaran atau aktivasi akun.</span></div>`;}
  function login(){return `<div class="ot-login"><img data-ot-brand class="ot-login-logo" alt="Logo OpenTurath">${bookSculpture()}<h1>Masuk ke OpenTurath</h1><p>Ruang kajian kitab, rujukan, dan catatan Anda.</p>${button('Lanjutkan dengan Google','demo-login',true,'log-in')}<p class="ot-small">Google dibuka di browser untuk masuk. Setelah selesai, kembali ke OpenTurath.</p><div class="ot-login-footer">Dengan masuk, Anda menyetujui <button type="button" data-action="legal" class="ot-text-button cursor-interaction">Ketentuan Layanan</button> dan <button type="button" data-action="legal" class="ot-text-button cursor-interaction">Kebijakan Privasi</button>.</div></div>`;}
  function reader(){const n=notes[activeNote];return `<article class="ot-reader"><button type="button" data-go="catatan" class="ot-back cursor-interaction">${icon('arrow-left')}Catatan</button><div class="ot-count"><span>${esc(n.kind)}</span><span>${esc(n.time)}</span></div><h1 dir="auto">${esc(n.title||'Catatan tanpa judul')}</h1><div class="ot-reader-body" dir="auto">${esc(n.body)}</div><div class="ot-actions">${goButton('Edit catatan','editor',true,'square-pen')}${button('Lihat rujukan','note-book',false,'book-open')}</div></article>`;}
  const labels={baca:['Catatan','Pembaca'],pustaka:['Pustaka','Fikih Syafi’i'],kitab:['Pustaka','Identitas edisi'],kajian:['Kajian','Ruang Anda'],asisten:['Kajian','Asisten Fikih'],tahawwulat:['Kajian','Fikih Tahawwulat'],ruang:['Kajian','Sesi percakapan'],catatan:['Catatan','Semua catatan'],editor:['Catatan','Editor'],akun:['Akun','Preferensi'],akses:['Akun','Pilihan akses'],login:['OpenTurath','Masuk']};
  function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
  function render(){applyAppearance();const views={pustaka:library,kitab:detail,kajian,asisten:assistantList,tahawwulat,ruang:room,catatan:noteList,editor,baca:reader,akun:account,akses:access,login};if(!views[state.screen])state.screen='pustaka';screen.innerHTML=views[state.screen]();picker.value=state.screen;const crumb=labels[state.screen];root.querySelector('#ot-breadcrumb').innerHTML=`${crumb[0]} <span>/</span> <strong>${crumb[1]}</strong>`;const selected=['kitab'].includes(state.screen)?'pustaka':['editor','baca'].includes(state.screen)?'catatan':['akses','login'].includes(state.screen)?'akun':['asisten','tahawwulat','ruang'].includes(state.screen)?'kajian':state.screen;root.querySelectorAll('[data-go]').forEach(n=>{if(n.classList.contains('ot-nav')||n.parentElement.classList.contains('ot-mobile-nav')){if(n.dataset.go===selected)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');}});root.querySelectorAll('[data-ot-brand]').forEach(i=>i.src=mark);if(state.screen==='pustaka'){screen.querySelector('#ot-volume-filter').value=state.volume;updateLibrary();}if(state.screen==='akun')screen.querySelector('#ot-account-theme').value=state.tone;icons();}
  function modal(title,body,actions=''){const el=root.querySelector('#ot-modal');el.innerHTML=`<section class="ot-dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="ot-heading" style="margin-bottom:0"><h2>${title}</h2><button type="button" data-action="close-modal" aria-label="Tutup dialog" class="cursor-interaction">${icon('x')}</button></div>${body}${actions?`<div class="ot-actions">${actions}</div>`:''}</section>`;el.hidden=false;icons();el.querySelector('button')?.focus();}
  root.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.go){navigate(target.dataset.go);return;}
    if(target.dataset.book){state.bookId=Number(target.dataset.book);navigate('kitab');return;}
    if(target.dataset.field){state.field=target.dataset.field;navigate('asisten');return;}
    if(target.dataset.note!==undefined){activeNote=Number(target.dataset.note);navigate('baca');return;}
    if(target.dataset.noteFilter){state.noteFilter=target.dataset.noteFilter;render();persist();return;}
    if(target.dataset.format){const text=screen.querySelector('#ot-note-body');if(text){const start=text.selectionStart,end=text.selectionEnd;const selected=text.value.slice(start,end)||'teks';const type=target.dataset.format;const value=type==='bold'?`**${selected}**`:type==='italic'?`_${selected}_`:type==='list'?`\n- ${selected}`:type==='quote'?`\n> ${selected}`:type==='heading'?`\n## ${selected}`:selected;if(type==='align-right'){text.dir=text.dir==='rtl'?'auto':'rtl';}else{text.setRangeText(value,start,end,'select');}text.focus();captureDraft();screen.querySelector('#ot-draft-state').textContent='Draf berubah';}return;}
    const a=target.dataset.action;if(!a)return;
    if(a==='next'||a==='previous'){state.page+=a==='next'?1:-1;updateLibrary();}
    else if(a==='clear'){state.query='';state.volume='all';state.onlySaved=false;state.page=0;render();}
    else if(a==='saved'){state.onlySaved=!state.onlySaved;state.page=0;updateLibrary();target.setAttribute('aria-pressed',String(state.onlySaved));}
    else if(a==='bookmark'){const i=state.savedBooks.indexOf(state.bookId);if(i>=0)state.savedBooks.splice(i,1);else state.savedBooks.push(state.bookId);render();toast(i>=0?'Rujukan dihapus dari contoh tersimpan.':'Rujukan tersimpan dalam pratinjau.');}
    else if(a==='citation')modal('Sitasi kitab',`<p class="ot-ar" lang="ar">${esc(bibliography())}</p><p>Sitasi disusun dari metadata katalog. Teks ini dapat dipilih dan disalin.</p>`,button('Selesai','close-modal',true));
    else if(a==='collection')modal('Pustaka Fikih Syafi’i',`<p>${catalog.length} record edisi dari katalog aplikasi. Cari judul dan pengarang dalam bahasa Arab, lalu periksa identitas edisinya.</p><p>Keberadaan dalam katalog belum membuktikan isi kitab tersedia pada suatu sesi NotebookLM.</p>`,button('Kembali ke katalog','close-modal',true));
    else if(a==='tahawwulat-info')modal('Fikih Tahawwulat','<p>Khazanah karya Al-Habib Abu Bakar Al-Adni Al-Masyhur dengan lima peran asisten: telaah matan, penjelasan konsep, latihan, muhadharah, dan penyusunan bahan dakwah.</p>',button('Lihat lima asisten','close-modal',true));
    else if(a==='start-room'){state.role='Fikih Syafi’i';navigate('ruang');}
    else if(a.startsWith('role-')){state.role='Fikih Tahawwulat · '+roles[Number(a.slice(5))][0];navigate('ruang');}
    else if(a==='assistant-preview')modal('Pilih cakupan kajian','<p>Ilustrasi ruang percakapan menggunakan sesi Fikih Syafi’i sebagai contoh tata letak.</p>',goButton('Lihat ruang kajian','ruang',true));
    else if(a==='sources'){state.sources=!state.sources;screen.querySelector('.ot-room').dataset.sources=state.sources;if(state.device!=='mobile')toast('Rujukan tersedia di panel kanan.');}
    else if(a==='copy-answer')modal('Salin hasil kajian','<p>Tentukan kitab dan edisi yang dipakai. Catat judul bab, jilid, dan halaman ketika menelaah sumber.</p><p>Isi percakapan ini adalah contoh rancangan, bukan hasil penelitian.</p>',button('Selesai','close-modal',true));
    else if(a==='save-answer'){toast('Contoh jawaban tersedia di Catatan → Jawaban AI.');}
    else if(a==='new-note'||a==='book-note'){captureDraft();notes.unshift({title:a==='book-note'?'Catatan: '+title(book()):'',body:'',kind:'Catatan pribadi',preview:'',time:'Hari ini',book:state.bookId});activeNote=0;navigate('editor');}
    else if(a==='save-note'){captureDraft();state.noteFilter='Semua';navigate('catatan');toast('Catatan contoh disimpan selama pratinjau ini.');}
    else if(a==='note-book'){captureDraft();state.bookId=notes[activeNote].book;navigate('kitab');}
    else if(a==='text-size')modal('Ukuran teks bacaan','<p>Ukuran huruf bacaan diatur terpisah dari kontrol aplikasi.</p><label class="ot-search">Ukuran <input type="range" id="ot-reading-size" min="16" max="28" value="20" aria-label="Ukuran teks bacaan"></label><p class="ot-ar" id="ot-reading-sample" lang="ar" style="font-size:20px">الأم — أبو عبد الله محمد بن إدريس الشافعي</p>',button('Selesai','close-modal',true));
    else if(a==='about')modal('OpenTurath','<p>Ruang untuk menelaah kitab, menemukan rujukan, dan menyusun catatan kajian.</p>',button('Tutup','close-modal',true));
    else if(a==='legal')modal('Ketentuan & privasi','<p>Tampilan dokumen kebijakan menggunakan halaman baca yang sama dengan aplikasi. Naskah resmi tidak direkonstruksi dalam ilustrasi ini.</p>',button('Tutup','close-modal',true));
    else if(a==='demo-login'){navigate('kajian');toast('Login disimulasikan untuk pratinjau desain.');}
    else if(a==='order'||a==='order-tahawwulat')modal('Ringkasan akses',`<p><strong>${a==='order'?'Fikih Syafi’i':'Fikih Tahawwulat'}</strong><br>${offerPeriods[state.offerIndex]} · Akun contoh<br>${rupiah((a==='order'?offerAmounts.specialist:offerAmounts.tahawwulat)[state.offerIndex])}</p><p>Harga ilustrasi mengikuti konfigurasi aplikasi. Penawaran final diperiksa kembali saat pembayaran. Tidak ada transaksi dalam pratinjau ini.</p>`,button('Kembali','close-modal',true));
    else if(a==='redeem')modal('Gunakan kode akses','<p>Masukkan kode akses yang Anda terima.</p><label class="ot-search"><input aria-label="Kode akses" placeholder="Kode akses" id="ot-redeem-code"></label>',button('Periksa kode','check-redeem',true));
    else if(a==='check-redeem'){root.querySelector('#ot-modal').hidden=true;toast('Pratinjau tidak memvalidasi atau mengaktifkan kode.');}
    else if(a==='close-modal')root.querySelector('#ot-modal').hidden=true;
    persist();
  });
  function bibliography(){const b=book();return [b['المؤلف'],b['الكتاب'],b['الناشر'],b['سنة_الطبع_والطبعة']].filter(Boolean).join('، ');}
  root.addEventListener('input',event=>{if(event.target.id==='ot-book-search'){state.query=event.target.value;state.page=0;updateLibrary();}else if(event.target.id==='ot-note-title'||event.target.id==='ot-note-body'){captureDraft();screen.querySelector('#ot-draft-state').textContent='Draf contoh berubah';}else if(event.target.id==='ot-reading-size'){root.querySelector('#ot-reading-sample').style.fontSize=event.target.value+'px';}});
  root.addEventListener('change',event=>{if(event.target.id==='ot-offer-period'){state.offerIndex=Number(event.target.value);render();}if(event.target.id==='ot-volume-filter'){state.volume=event.target.value;state.page=0;updateLibrary();}if(event.target.id==='ot-account-theme'){state.tone=event.target.value;applyAppearance();persist();}});
  root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='ot-chat-form'){const text=screen.querySelector('#ot-message').value.trim();if(!text)return;const q=screen.querySelector('.ot-question');q.textContent=text;screen.querySelector('#ot-message').value='';toast('Pertanyaan contoh ditampilkan. Mesin asisten tidak terhubung.');}});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){root.querySelector('#ot-modal').hidden=true;}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(state.screen!=='pustaka')navigate('pustaka');screen.querySelector('#ot-book-search').focus();}});
  root.querySelector('#ot-modal').addEventListener('click',event=>{if(event.target.id==='ot-modal')event.target.hidden=true;});
  picker.addEventListener('change',()=>navigate(picker.value));
  root.querySelector('#ot-device-toggle').addEventListener('click',()=>{state.device=state.device==='desktop'?'mobile':'desktop';applyAppearance();persist();});
  root.querySelector('#ot-theme-toggle').addEventListener('click',()=>{state.tone=state.tone==='dark'?'light':'dark';applyAppearance();persist();});
  function restore(saved){if(!saved)return;const v={...saved.modelContent,...saved.privateContent};if(labels[v.screen])state.screen=v.screen;if(['desktop','mobile'].includes(v.device))state.device=v.device;if(['system','light','dark'].includes(v.tone))state.tone=v.tone;if(catalog.some(b=>b.id===v.bookId))state.bookId=v.bookId;if(typeof v.fontSize==='number')state.fontSize=Math.max(12,Math.min(17,v.fontSize));if(typeof v.rowSpace==='number')state.rowSpace=Math.max(12,Math.min(23,v.rowSpace));if(typeof v.glassBlur==='number')state.glassBlur=Math.max(8,Math.min(40,v.glassBlur));if(typeof v.tilt==='number')state.tilt=Math.max(14,Math.min(38,v.tilt));}
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);render();});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyAppearance();persist();}});tweak.addSlider(state,'rowSpace',{label:'Ruang antarbaris kitab',min:12,max:23,unit:'px'});tweak.addSlider(state,'glassBlur',{label:'Keburaman kaca',min:8,max:40,unit:'px',reference:'--fg-blur'});tweak.addSlider(state,'tilt',{label:'Sudut kitab 3D',min:14,max:38,unit:'°',reference:'--fg-turn'});}
})();
</script>
